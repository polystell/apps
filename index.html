<style>

<body>
<script src="/core/polystell.js?v=5"></script>
<script>
'use strict';
/* =====================================================================
   POLYSTELL APPS — HUB v2 sobre o core v5.
   Catálogo: 00_Catalogo_Apps (CHAVE exclusiva + ACESSO Geral/Por liberação)
   Liberações: 00_Acessos (APP+PESSOA+ATIVO) — visibilidade é usabilidade;
   a barreira real é a permissão de cada app no SharePoint.
   Log central: 00_Log_Apps. Parâmetros: 00_Parametros_Apps (APP='Hub').
   Nenhum segredo neste arquivo; papéis/autorizações só em listas.
===================================================================== */
const APP_VERSION='2.0.0';const APP_BUILD='2026-10-29';
const CFG={
 spHost:'https://'+PS.cfg.siteHost, sitePath:PS.cfg.sitePath,
 lists:{cat:'00_Catalogo_Apps',acc:'00_Acessos',log:'00_Log_Apps',par:'00_Parametros_Apps'},
 adminKey:'hub.admin'
};
const SCOPE_SP=[CFG.spHost+'/AllSites.Write'];
const API=CFG.spHost+CFG.sitePath+'/_api/';
const esc=PS.esc,norm=PS.norm,toast=PS.toast;
const collator=new Intl.Collator('pt-BR',{sensitivity:'base',numeric:true});
const asText=v=>{if(v==null)return'';if(typeof v==='object')return String(v.Url||v.url||v.Description||'').trim();return String(v).trim();};

/* ---------------- camada REST (mesma disciplina do Planejamento) ---------------- */
const ETAGS={};const tagKey=(l,id)=>l+'#'+id;
const bumpTag=(l,id)=>{const k=tagKey(l,id),m=/^"?(\d+)"?$/.exec(ETAGS[k]||'');if(m)ETAGS[k]='"'+(Number(m[1])+1)+'"';else delete ETAGS[k];};
const readTag=r=>r['odata.etag']||r['@odata.etag']||(r.__metadata&&r.__metadata.etag)||null;
async function sp(path,opt={}){
  if((opt.merge||opt.del)&&!opt.etag)throw Object.assign(new Error('A versão deste registro não está disponível — recarregando os dados; tente novamente.'),{status:412});
  const headers={Accept:'application/json;odata=minimalmetadata','Content-Type':opt.ctype||'application/json;odata=nometadata'};
  if(opt.merge){headers['IF-MATCH']=opt.etag;headers['X-HTTP-Method']='MERGE';}
  if(opt.del){headers['IF-MATCH']=opt.etag;headers['X-HTTP-Method']='DELETE';}
  const res=await PS.sprest(path.startsWith('http')?path:API+path,{method:opt.method||'GET',headers,body:opt.body!=null?JSON.stringify(opt.body):undefined,scopes:SCOPE_SP});
  if(res.status===412)throw Object.assign(new Error('O registro foi alterado por outra pessoa enquanto você editava (412).'),{status:412,requestId:res.headers.get('SPRequestGuid')||res.headers.get('request-id')||''});
  if(!res.ok){let d='';try{d=(await res.text()).slice(0,400);}catch(e){}
    throw Object.assign(new Error('HTTP '+res.status+' em '+path+'\n'+d),{status:res.status,requestId:res.headers.get('SPRequestGuid')||res.headers.get('request-id')||''});}
  if(res.status===204)return {ETag:res.headers.get('ETag')||null};
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
async function getAll(list,query){
  let url="web/lists/getbytitle('"+encodeURIComponent(list)+"')/items?"+query;const out=[];
  while(url){const j=await sp(url);(j.value||[]).forEach(r=>{const et=readTag(r);if(et&&r.Id!=null)ETAGS[tagKey(list,r.Id)]=et;});out.push(...(j.value||[]));url=j['odata.nextLink']||null;}
  return out;
}
const mergeItem=async(list,id,fields)=>{const r=await sp("web/lists/getbytitle('"+encodeURIComponent(list)+"')/items("+id+")",{method:'POST',merge:true,etag:ETAGS[tagKey(list,id)],body:fields});
  if(r&&r.ETag)ETAGS[tagKey(list,id)]=r.ETag;else bumpTag(list,id);return r;};
const addItem=async(list,fields)=>{const j=await sp("web/lists/getbytitle('"+encodeURIComponent(list)+"')/items",{method:'POST',body:fields});if(j&&j.Id!=null)ETAGS[tagKey(list,j.Id)]=readTag(j)||'"1"';return j;};
async function ensureUser(email){const j=await sp('web/ensureuser',{method:'POST',body:{logonName:'i:0#.f|membership|'+email}});return j.Id;}
function logApp(e,tela){
  try{
    const f={Title:new Date().toISOString(),APP:'Hub',VERSAO:APP_VERSION,USUARIO:(DB.me&&DB.me.email)||'',TELA:tela||S.view,HTTP_STATUS:String((e&&e.status)!=null?e.status:''),REQUEST_ID:String((e&&e.requestId)||''),MENSAGEM:String((e&&e.message)||e).slice(0,255)};
    addItem(CFG.lists.log,f).catch(err=>console.warn('log indisponível:',err&&err.message));
  }catch(_){console.warn('log não gravado');}
}

/* ---------------- fila de gravação / busy ---------------- */
let busyN=0;
function busy(on,label){busyN+=on?1:-1;if(busyN<0)busyN=0;let el=document.getElementById('busy');
  if(busyN>0){if(!el){el=document.createElement('div');el.id='busy';document.body.appendChild(el);}el.textContent=label||'Gravando…';}
  else if(el)el.remove();}
const escrevendo=()=>{if(busyN>0){toast('Aguarde a gravação anterior terminar.','warn');return true;}return false;};

/* ---------------- ícones (família do hub; cai no PS.icon se faltar) ---------------- */
const ICONS={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
 star:'<path d="m12 3 2.8 5.6 6.2.9-4.5 4.4 1.1 6.1-5.6-2.9-5.6 2.9 1.1-6.1L3 9.5l6.2-.9Z"/>',

 layers:'<path d="m3 7 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5M3 17l9 5 9-5"/>',

function categoryMeta(cat){const n=norm(cat);
 if(n.includes('finance'))return {...COLORS[0],icon:'wallet',nav:'chart'};
 if(n.includes('gest')||n.includes('projeto'))return {...COLORS[1],icon:'briefcase',nav:'box'};
 if(n.includes('pessoa')||n.includes('human')||n==='rh')return {...COLORS[2],icon:'users',nav:'users'};
 if(n.includes('opera')||n.includes('produ')||n.includes('logist'))return {...COLORS[3],icon:'layers',nav:'truck'};
 if(n.includes('tecnol')||n==='ti')return {...COLORS[4],icon:'laptop',nav:'shield'};
 if(n.includes('esg')||n.includes('ambien'))return {...COLORS[1],icon:'leaf',nav:'leaf'};
 let h=0;for(const c of n)h=(h+c.charCodeAt(0))%COLORS.length;return {...COLORS[h],icon:'folder',nav:'grid'};}

function readStorage(){storageKey='polystell.hub.v2.'+((acct&&(acct.homeAccountId||acct.username))||'conta');
 let s=null;try{s=JSON.parse(localStorage.getItem(storageKey)||'null');}catch(_){}
 favorites=new Set(Array.isArray(s&&s.favorites)?s.favorites.filter(x=>typeof x==='string'):[]);
 recents=Array.isArray(s&&s.recents)?s.recents.filter(r=>r&&typeof r.k==='string'&&Number.isFinite(r.at)).slice(0,30):[];}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({favorites:[...favorites],recents}));}catch(_){toast('O navegador não permitiu salvar preferências — valem só nesta sessão.','warn');}}

function mapApps(rows){
 return rows.map((f,i)=>({
   id:String(f.Id),key:asText(f.CHAVE)||('id'+f.Id),
   nome:asText(f.NOME||f.Title),pasta:asText(f.PASTA),
   categoria:asText(f.CATEGORIA)||'Outros',desc:asText(f.DESCRICAO),
   icone:(asText(f.ICONE)||'grid').toLowerCase(),status:asText(f.STATUS)||'Ativo',
   acesso:norm(asText(f.ACESSO)).startsWith('por')?'lib':'geral',semChave:!asText(f.CHAVE),order:i
 })).filter(a=>a.nome&&norm(a.status)!=='inativo');
}
async function loadCat(){DB.apps=mapApps(await getAll(CFG.lists.cat,'$top=500'));}
async function loadAcc(){
 try{const rows=await getAll(CFG.lists.acc,'$select=Id,APP,ATIVO,PESSOA/EMail,PESSOA/Title&$expand=PESSOA&$top=2000');
   DB.acc=rows.filter(r=>r.PESSOA&&r.PESSOA.EMail).map(r=>({Id:r.Id,app:asText(r.APP),ativo:!!r.ATIVO,email:String(r.PESSOA.EMail).toLowerCase(),nome:r.PESSOA.Title||r.PESSOA.EMail}));
   DB.accState='ok';}
 catch(e){DB.acc=null;DB.accState='error';console.warn('00_Acessos indisponível:',e&&e.message);}
 DB.admin=!!(DB.acc&&DB.me&&DB.acc.some(r=>r.ativo&&r.email===DB.me.email&&norm(r.app)===norm(CFG.adminKey)));
}
const meuAcesso=k=>!!(DB.acc&&DB.me&&DB.acc.some(r=>r.ativo&&r.email===DB.me.email&&norm(r.app)===norm(k)));
function allowed(a){if(a.acesso==='geral')return true;if(DB.admin)return true;if(DB.accState!=='ok')return false;return meuAcesso(a.key);}
const myApps=()=>DB.apps.filter(allowed);

function statusOf(a){const s=norm(a.status);
 return s==='manutencao'?{name:'Em manutenção',cls:'man',blocked:true}
  :s==='em implantacao'?{name:'Em implantação',cls:'dep',blocked:false}
  :{name:'Disponível',cls:'',blocked:false};}
function appUrl(a){try{const raw=a.pasta;if(!raw)return null;const u=new URL(raw,location.origin+'/');
 if(!['https:','http:'].includes(u.protocol)||u.username||u.password)return null;return u.href;}catch(_){return null;}}
function rememberApp(k){recents=[{k,at:Date.now()},...recents.filter(r=>r.k!==k)].slice(0,30);persist();}
function openApp(k){const a=myApps().find(x=>x.key===k);if(!a)return;
 const st=statusOf(a);
 if(st.blocked){PS.dialog({title:'Aplicativo em manutenção',html:'<p><b>'+esc(a.nome)+'</b> está sinalizado como em manutenção no catálogo. Tente novamente mais tarde ou fale com a TI.</p>'});return;}
 const url=appUrl(a);
 if(!url){PS.dialog({title:'Endereço não configurado',html:'<p>O aplicativo <b>'+esc(a.nome)+'</b> não tem um endereço válido no catálogo. Avise a TI.</p>'});return;}
 rememberApp(k);render();window.open(url,'_blank','noopener');}
function aicon(a){const m=categoryMeta(a.categoria);return '<span class="aicon" style="--tone:'+m.tone+';--tint:'+m.tint+'">'+ic(a.icone)+'</span>';}
function card(a){const st=statusOf(a),fav=favorites.has(a.key);
 return '<article class="acard'+(st.blocked?' man':'')+'">'+
  '<div class="top">'+aicon(a)+'<span class="acts"><span class="badge '+st.cls+'">'+esc(st.name)+'</span>'+
  '<button class="starbtn" data-fav="'+esc(a.key)+'" aria-pressed="'+fav+'" title="'+(fav?'Remover dos':'Adicionar aos')+' favoritos" aria-label="'+(fav?'Remover':'Adicionar')+' '+esc(a.nome)+' '+(fav?'dos':'aos')+' favoritos">'+ic('star')+'</button></span></div>'+
  '<h3><button data-open="'+esc(a.key)+'">'+esc(a.nome)+'</button></h3>'+
  '<p class="desc">'+esc(a.desc||'Acesse este aplicativo pelo seu catálogo corporativo.')+'</p>'+
  '<div class="foot"><span>'+esc(a.categoria)+'</span><b data-open="'+esc(a.key)+'">'+(st.blocked?'Indisponível':'Abrir '+ic('arrow-up-right'))+'</b></div></article>';}
function visiveis(){let apps=myApps();
 if(S.view==='fav')apps=apps.filter(a=>favorites.has(a.key));
 if(S.view==='rec'){apps=apps.filter(a=>recents.some(r=>r.k===a.key));apps.sort((a,b)=>(recents.find(r=>r.k===b.key)||{}).at-(recents.find(r=>r.k===a.key)||{}).at);}
 if(S.cat!=='all')apps=apps.filter(a=>a.categoria===S.cat);

  try{
   if(on){if(reg){await mergeItem(CFG.lists.acc,reg.Id,{ATIVO:false});reg.ativo=false;}toast('Liberação removida.');}
   else if(reg){await mergeItem(CFG.lists.acc,reg.Id,{ATIVO:true});reg.ativo=true;toast('Liberação reativada.');}
   else{const uid=await ensureUser(S.segUser);
    const j=await addItem(CFG.lists.acc,{Title:S.segUser,APP:k,ATIVO:true,PESSOAId:uid});
    DB.acc.push({Id:j.Id,app:k,ativo:true,email:S.segUser,nome:(DB.acc.find(r=>r.email===S.segUser)||{}).nome||S.segUser});toast('Módulo liberado.');}
  }catch(e){logApp(e,'seg');toast(e&&e.status===412?'Alguém alterou este registro ao mesmo tempo que você — recarregando.':'Não foi possível gravar: '+String((e&&e.message)||e).split('\n')[0],'err');
   try{await loadAcc();}catch(_){}}
  finally{busy(false);}
  if(UI)UI.setNav(buildNav());render();
 });
 const add=document.getElementById('aceAdd');
 if(add)add.onclick=()=>{
  const em=String(document.getElementById('aceEmail').value||'').trim().toLowerCase();
  if(!em||em.indexOf('@')<1||em.indexOf('.')<0){toast('Informe um e-mail corporativo válido.','warn');return;}
  if(!DB.acc.some(r=>r.email===em))DB.acc.push({Id:0,app:'',ativo:false,email:em,nome:em});
  S.segUser=em;render();toast('Agora ligue os módulos da pessoa — cada liberação grava na hora.');
 };
}
/* --- aba Parâmetros (00_Parametros_Apps, APP='Hub') --- */
function segPar(){
 const box=document.getElementById('segBody');
 const paint=()=>{
  if(DB.parState!=='ok'){box.innerHTML='<p class="warnline">⚠ Não foi possível ler a 00_Parametros_Apps — confira a lista e a sua permissão de Leitura.</p>';return;}
  const rows=DB.par.filter(r=>norm(asText(r.APP))==='hub');
  box.innerHTML='<p class="hint">Parâmetros do Hub na lista central 00_Parametros_Apps (APP = "Hub"). O Hub ainda não tem parâmetros de comportamento — quando tiver, aparecem e são editados aqui, no mesmo padrão dos demais apps.</p>'+
   (rows.length?'<div class="gridwrap"><table class="simple"><thead><tr><th>Módulo</th><th>Chave</th><th>Valor</th><th style="width:90px">Ativo</th><th>Descrição</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(asText(r.MODULO))+'</td><td><span class="sub code" style="margin:0">'+esc(asText(r.CHAVE))+'</span></td><td><b>'+esc(asText(r.VALOR))+'</b></td><td><span class="chipk '+(r.ATIVO?'c-ok':'c-draft')+'">'+(r.ATIVO?'Sim':'Não')+'</span></td><td class="muted">'+esc(asText(r.DESCRICAO))+'</td></tr>').join('')+'</tbody></table></div>'
   :'<p class="empty">Nenhum parâmetro gravado para o Hub.</p>');
 };
 if(DB.par===null&&DB.parState==='error'){
  box.innerHTML='<p class="hint">Carregando…</p>';
  getAll(CFG.lists.par,'$top=500').then(r=>{DB.par=r;DB.parState='ok';paint();}).catch(e=>{DB.par=null;DB.parState='error';console.warn(e&&e.message);paint();});
 }else paint();
}
/* --- aba Log do sistema (00_Log_Apps, central) --- */
function segLog(){
 const box=document.getElementById('segBody');
 box.innerHTML='<div class="row"><b style="font-size:13px">Log central dos aplicativos</b><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="segLogApp" aria-label="Filtrar por aplicativo"><option value="">Todos os apps</option></select><input type="text" id="segLogQ" placeholder="Filtrar registros…" style="width:220px" aria-label="Filtrar registros"><button class="btn" id="segLogR">Atualizar</button></span></div>'+
  '<p class="hint">Últimos 100 registros técnicos da 00_Log_Apps — gravados pelos próprios aplicativos em falhas (sem token e sem dados de negócio). Somente leitura.</p><div id="segLogOut"><p class="hint">Carregando registros…</p></div>';
 const out=document.getElementById('segLogOut'),q=document.getElementById('segLogQ'),selApp=document.getElementById('segLogApp');
 const fmt=t=>{const d=new Date(t);return isFinite(d)?d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):String(t||'');};
 const paint=()=>{
  const f=(q.value||'').trim().toLowerCase(),ap=selApp.value;
  const rows=(DB.logRows||[]).filter(r=>(!ap||asText(r.APP)===ap)&&(!f||JSON.stringify(r).toLowerCase().includes(f)));
  out.innerHTML=rows.length
   ?'<div class="gridwrap"><table class="simple"><thead><tr><th style="width:135px">Quando</th><th style="width:120px">App</th><th style="width:210px">Usuário</th><th style="width:90px">Tela</th><th style="width:60px">HTTP</th><th>Mensagem</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+fmt(r.Title)+'<span class="detline">v'+esc(asText(r.VERSAO))+'</span></td><td>'+esc(asText(r.APP))+'</td><td>'+esc(asText(r.USUARIO))+'</td><td>'+esc(asText(r.TELA))+'</td><td>'+esc(asText(r.HTTP_STATUS))+'</td><td>'+esc(asText(r.MENSAGEM))+(r.REQUEST_ID?'<span class="detline sub code">req '+esc(asText(r.REQUEST_ID))+'</span>':'')+'</td></tr>').join('')+'</tbody></table></div>'
   :(DB.logRows?'<p class="empty">Nenhum registro'+((f||ap)?' para o filtro':'')+' — bom sinal.</p>':'');
  const apps=[...new Set((DB.logRows||[]).map(r=>asText(r.APP)).filter(Boolean))].sort();
  if(selApp.options.length<=1)apps.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;selApp.appendChild(o);});
 };
 const load=async(force)=>{
  if(DB.logRows&&!force){paint();return;}
  out.innerHTML='<p class="hint">Carregando registros…</p>';
  try{const j=await sp("web/lists/getbytitle('"+encodeURIComponent(CFG.lists.log)+"')/items?$select=Id,Title,APP,VERSAO,USUARIO,TELA,HTTP_STATUS,REQUEST_ID,MENSAGEM&$orderby=Id desc&$top=100");
   DB.logRows=(j&&j.value)||[];paint();}
  catch(e){out.innerHTML='<p class="warnline">Não foi possível ler a 00_Log_Apps'+(e&&e.status?' (HTTP '+e.status+')':'')+' — confira se a lista existe e se você tem Leitura nela.</p>';}
 };
 q.oninput=paint;selApp.onchange=paint;document.getElementById('segLogR').onclick=()=>{DB.logRows=null;load(true);};
 load(false);
}
/* --- aba Diagnóstico --- */
async function diagAmbiente(){
 const out=[];const ok=(n,d)=>out.push([n,true,d||'']);const bad=(n,d)=>out.push([n,false,d||'']);
 out.push(['Aplicativo',true,'Polystell Apps v'+APP_VERSION+' · build '+APP_BUILD]);
 out.push(['Core compartilhado',!!(PS&&PS.auth&&PS.mount&&PS.sprest&&PS.screens),'PS '+(PS?'carregado':'ausente')+' (auth · mount · sprest · telas)']);
 out.push(['Usuário',!!DB.me,(DB.me?DB.me.email:'—')+(DB.admin?' · Administração do Hub':'')]);
 for(const [nome,lista] of [['Catálogo (00_Catalogo_Apps)',CFG.lists.cat],['Liberações (00_Acessos)',CFG.lists.acc],['Log central (00_Log_Apps)',CFG.lists.log],['Parâmetros (00_Parametros_Apps)',CFG.lists.par]]){
  try{await getAll(lista,'$select=Id&$top=1');ok(nome,'leitura OK');}catch(e){bad(nome,e&&e.status?'HTTP '+e.status:String((e&&e.message)||e).split('\n')[0]);}
 }
 try{const j=await sp("web/lists/getbytitle('"+encodeURIComponent(CFG.lists.cat)+"')/fields?$filter=InternalName eq 'CHAVE'&$select=Required,EnforceUniqueValues");
  const f=(j&&j.value&&j.value[0])||null;
  if(f&&f.Required&&f.EnforceUniqueValues)ok('CHAVE no catálogo','obrigatória · exclusiva');
  else if(f)bad('CHAVE no catálogo','Obrigatória='+(f.Required?'Sim':'Não')+' · Exclusiva='+(f.EnforceUniqueValues?'Sim':'Não')+' — configure na coluna');
  else bad('CHAVE no catálogo','coluna não encontrada — crie CHAVE (texto, obrigatória, valores exclusivos)');
 }catch(e){bad('CHAVE no catálogo',e&&e.status?'HTTP '+e.status:'');}
 const semChave=DB.apps.filter(a=>a.semChave);
 out.push(['Apps com CHAVE preenchida',semChave.length===0,semChave.length?('faltando em: '+semChave.map(a=>a.nome).join(', ')):(DB.apps.length+' app(s) OK')]);
 out.push(['Estado das liberações',DB.accState==='ok',DB.accState==='ok'?((DB.acc||[]).length+' registro(s)'):'não carregadas — apps controlados ocultos']);
 return out;
}
function segDiag(){
 const box=document.getElementById('segBody');
 box.innerHTML='<div class="row"><b style="font-size:13px">Diagnóstico do ambiente</b><button class="btn" id="btnDiag">Verificar ambiente</button></div>'+
  '<p class="hint">Verificação somente leitura — versão, core, listas centrais e integridade do catálogo. É o teste pré-Go-Live e o primeiro passo de qualquer suporte.</p><div id="segDiagOut"></div>';
 const dg=document.getElementById('btnDiag');
 dg.onclick=async()=>{
  const outEl=document.getElementById('segDiagOut');
  dg.disabled=true;outEl.innerHTML='<p class="hint">Verificando… (somente leitura)</p>';
  try{const res=await diagAmbiente();
   outEl.innerHTML='<div class="gridwrap"><table class="simple"><thead><tr><th>Verificação</th><th style="width:110px">Resultado</th><th>Detalhe</th></tr></thead><tbody>'+res.map(r=>'<tr><td>'+esc(r[0])+'</td><td><span class="chipk '+(r[1]?'c-ok':'c-bad')+'">'+(r[1]?'OK':'Falhou')+'</span></td><td class="muted">'+esc(r[2]||'')+'</td></tr>').join('')+'</tbody></table></div>';}
  catch(e){outEl.innerHTML='<p class="warnline">Não foi possível concluir a verificação: '+esc(String((e&&e.message)||e).split('\n')[0])+'</p>';}
  dg.disabled=false;
 };
}

/* ---------------- render / boot ---------------- */
function render(keepFocus){
 const q=keepFocus&&document.getElementById('hubQ')===document.activeElement;
 if(S.view==='seg'&&!DB.admin)S.view='home';
 if(S.view==='seg')renderSeg();else renderHub();
 if(q){const el=document.getElementById('hubQ');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
}
async function refreshData(){
 UI.setSync('ok','Atualizando…');
 try{await loadCat();await loadAcc();DB.logRows=null;DB.par=null;DB.parState='error';
  UI.setNav(buildNav());UI.setSync('ok','Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));}
 catch(e){logApp(e,'refresh');UI.setSync('bad','Falha ao atualizar');toast('Não foi possível atualizar: '+String((e&&e.message)||e).split('\n')[0],'err');}
 render();
}
async function start(){
 PS.screens.loading('Preparando seu ambiente de trabalho…');
 try{
  DB.me={email:String(acct.username||'').toLowerCase(),name:acct.name||acct.username};
  readStorage();
  await loadCat();
  await loadAcc();
  UI=PS.mount({app:'Hub',nav:buildNav(),current:S.view,onNav,account:acct});
  PS.auth.ready();
  const back=document.querySelector('.ps-back');if(back)back.remove(); /* o hub é o próprio destino */
  UI.page.innerHTML='<section id="view"></section>';
  const ta=document.querySelector('.ps-topact');
  if(ta)ta.insertAdjacentHTML('afterbegin','<button class="ps-iconbtn" id="btnRefresh" title="Recarregar o catálogo" aria-label="Atualizar">'+PS.icon('refresh')+'</button>');
  const br=document.getElementById('btnRefresh');if(br)br.onclick=refreshData;
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const q=document.getElementById('hubQ');if(q){q.focus();q.select();}}});
  render();
 }catch(e){
  console.error(e);try{logApp(e,'start');}catch(_){}
  PS.screens.error('Não foi possível abrir seu ambiente','Verifique sua conexão e as permissões do catálogo (00_Catalogo_Apps). Se o problema persistir, contate a TI.',{retry:true,details:[String((e&&e.message)||e).slice(0,300)]});
 }
}
(async function boot(){
 try{
  PS.screens.loading('Validando acesso…');
  acct=await PS.auth.init();
  if(!acct){PS.screens.login({app:'Polystell Apps',onLogin:()=>PS.auth.login(SCOPE_SP)});return;}
  await start();
 }catch(e){console.error(e);PS.screens.error('Falha na autenticação',String((e&&e.message)||e));}
})();
</script>
