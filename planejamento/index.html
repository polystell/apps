function segAce(){
  const box=document.getElementById('segBody');
  if(!DB.perfRaw){box.innerHTML=`<p class="empty warnline">⚠ Não foi possível carregar a 08_Perfis — os papéis ficam indisponíveis. Clique em Atualizar ou verifique a lista e a sua permissão de Leitura.</p>`;return;}
  const rows=DB.perfRaw.filter(r=>r.PESSOA&&r.PESSOA.EMail);
  let h=`<p class="hint">Papéis do aplicativo, gravados na 08_Perfis: <b>Administrador</b> administra e vê tudo, <b>Aprovador</b> decide na tela de Aprovação, <b>Assessoria</b> acompanha. O papel controla o que o aplicativo mostra — o acesso de uso continua sendo a permissão de cada lista/pasta no SharePoint. A gravação exige Edição na 08_Perfis (TI).</p>`;
  h+=`<div class="gridwrap"><table class="simple"><thead><tr><th>Pessoa</th>${PAPEIS.map(p=>`<th style="width:125px">${p}</th>`).join('')}<th style="width:80px">Ativo</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const lista=Array.isArray(r.PERFIL)?r.PERFIL:[r.PERFIL].filter(Boolean);
    h+=`<tr${r.ATIVO?'':' style="opacity:.55"'}><td><b>${esc(r.PESSOA.Title||r.PESSOA.EMail)}</b><span class="detline">${esc(r.PESSOA.EMail)}</span></td>${PAPEIS.map(p=>`<td><input type="checkbox" data-pf="${r.Id}" data-papel="${p}"${lista.includes(p)?' checked':''}${r.ATIVO?'':' disabled'} aria-label="${p} para ${esc(r.PESSOA.EMail)}"></td>`).join('')}<td><input type="checkbox" data-pativo="${r.Id}"${r.ATIVO?' checked':''} aria-label="Ativo para ${esc(r.PESSOA.EMail)}"></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<div class="row" style="margin-top:14px;flex-wrap:wrap"><b style="font-size:13px">Adicionar pessoa</b><input type="email" id="aceEmail" placeholder="email@polystell.com.br" style="width:250px" aria-label="E-mail da pessoa">${PAPEIS.map(p=>`<label style="display:inline-flex;gap:5px;align-items:center;font-size:13px"><input type="checkbox" data-novo="${p}">${p}</label>`).join('')}<button class="btn" id="aceAdd">Adicionar</button></div>`;
  box.innerHTML=h;
  const souEu=r=>String((r.PESSOA&&r.PESSOA.EMail)||'').toLowerCase()===DB.me.email;
  const aposGravar=()=>{setPerfis(DB.perfRaw);recalcRole();if(UI)UI.setNav(buildNav());render();};
  box.querySelectorAll('[data-pf]').forEach(cb=>{cb.onchange=async()=>{
    if(escrevendo()){render();return;}
    const r=DB.perfRaw.find(x=>x.Id===Number(cb.dataset.pf));if(!r)return;
    const p=cb.dataset.papel;
    if(p==='Administrador'&&!cb.checked&&souEu(r)){toast('Você não pode remover o seu próprio papel de Administrador.','warn');render();return;}
    const atual=Array.isArray(r.PERFIL)?r.PERFIL.slice():[r.PERFIL].filter(Boolean);
    const novo=cb.checked?atual.concat(atual.includes(p)?[]:[p]):atual.filter(x=>x!==p);
    const tipo=await acePerfMeta();
    if(tipo==='Choice'&&novo.length>1){toast('A coluna PERFIL desta lista aceita um único papel por pessoa — desmarque o atual antes.','warn');render();return;}
    busy(true);
    try{const grava=tipo==='Choice'?(novo[0]||''):novo;
      await mergeItem(CFG.lists.perfil,r.Id,{PERFIL:grava});r.PERFIL=grava;toast('Papéis atualizados.');}
    catch(e){fail(e);return;}
    finally{busy(false);}
    aposGravar();
  };});
  box.querySelectorAll('[data-pativo]').forEach(cb=>{cb.onchange=async()=>{
    if(escrevendo()){render();return;}
    const r=DB.perfRaw.find(x=>x.Id===Number(cb.dataset.pativo));if(!r)return;
    if(!cb.checked&&souEu(r)){toast('Você não pode desativar o seu próprio registro.','warn');render();return;}
    busy(true);
    try{await mergeItem(CFG.lists.perfil,r.Id,{ATIVO:cb.checked});r.ATIVO=cb.checked;toast(cb.checked?'Pessoa reativada.':'Pessoa desativada — os papéis ficam guardados.');}
    catch(e){fail(e);return;}
    finally{busy(false);}
    aposGravar();
  };});
  document.getElementById('aceAdd').onclick=async()=>{
    if(escrevendo())return;
    const em=String(document.getElementById('aceEmail').value||'').trim().toLowerCase();
    const sel=Array.from(box.querySelectorAll('[data-novo]:checked')).map(c=>c.dataset.novo);
    if(!em||em.indexOf('@')<1||em.indexOf('.')<0){toast('Informe um e-mail corporativo válido.','warn');return;}
    if(!sel.length){toast('Marque ao menos um papel para a pessoa.','warn');return;}
    if(DB.perfRaw.some(r=>r.PESSOA&&String(r.PESSOA.EMail||'').toLowerCase()===em)){toast('Essa pessoa já está na lista — ajuste os papéis na própria linha.','warn');return;}
    const tipo=await acePerfMeta();
    if(tipo==='Choice'&&sel.length>1){toast('A coluna PERFIL desta lista aceita um único papel por pessoa.','warn');return;}
    busy(true);
    try{const uid=await ensureUser(em);
      const grava=tipo==='Choice'?sel[0]:sel;
      const j=await addItem(CFG.lists.perfil,{Title:em,ATIVO:true,PESSOAId:uid,PERFIL:grava});
      DB.perfRaw.push({Id:j.Id,ATIVO:true,PERFIL:grava,PESSOA:{EMail:em}});
      toast('Pessoa adicionada aos papéis do aplicativo.');}
    catch(e){fail(e);return;}
    finally{busy(false);}
    aposGravar();
  };
}

/* ======================= DADOS COMPARTILHADOS ======================== */
function setCadastros(depts,ccs,cats){
  DB.deptByCod={};DB.deptById={};DB.ccMap={};DB.catMap={};
  DB.depts=depts.filter(d=>d.COD_DPTO).sort((a,b)=>a.COD_DPTO.localeCompare(b.COD_DPTO));
  DB.depts.forEach(d=>{DB.deptByCod[d.COD_DPTO]=d;DB.deptById[d.Id]=d;});
  DB.ccs=ccs.filter(c=>c.COD_CC).sort((a,b)=>a.COD_CC.localeCompare(b.COD_CC));
  DB.ccs.forEach(c=>DB.ccMap[c.COD_CC]=c.DESC_CC||'');
  DB.cats=cats.filter(c=>c.COD_CAT).sort((a,b)=>a.COD_CAT.localeCompare(b.COD_CAT));
  DB.cats.forEach(c=>DB.catMap[c.COD_CAT]=c.DESC_CAT||'');
}
function setVincs(rows){
  const map=v=>({Id:v.Id,cod:DB.deptById[v.DEPARTAMENTOId].COD_DPTO,email:(v.GESTOR.EMail||'').toLowerCase(),nome:v.GESTOR.Title||v.GESTOR.EMail});
  const valid=rows.filter(v=>v.GESTOR&&DB.deptById[v.DEPARTAMENTOId]);
  DB.vincs=valid.filter(v=>v.ATIVO).map(map);
  DB.vincsOff=valid.filter(v=>!v.ATIVO).map(map);
}
function setPerfis(rows){
  DB.perfRaw=rows||null;
  if(!rows){DB.perfis=null;return;}
  // PERFIL pode ser opção única (texto) ou múltipla (lista) — aceita os dois
  DB.perfis=rows.filter(r=>r.ATIVO&&r.PESSOA&&r.PESSOA.EMail&&r.PERFIL)
    .flatMap(r=>(Array.isArray(r.PERFIL)?r.PERFIL:[r.PERFIL]).map(pf=>({email:String(r.PESSOA.EMail).toLowerCase(),perfil:String(pf)})));
}
function recalcRole(){
  const mine=myDepts();let admin,aprov,assess=false;
  if(DB.perfis){ // a lista 08_Perfis é a fonte dos papéis
    const meus=DB.perfis.filter(p=>p.email===DB.me.email).map(p=>p.perfil);
    admin=meus.includes('Administrador');
    aprov=meus.includes('Aprovador');
    assess=meus.includes('Assessoria');
  }else{ // 08_Perfis inacessível: ninguém recebe papel elevado (gestores seguem pelos vínculos)
    admin=false;aprov=false;
  }
  S.role={admin,aprov,assess,all:admin||aprov||assess};
}
function roleLabel(mine){
  if(S.role.aprov)return 'Diretoria';
  if(S.role.admin)return 'Administração';
  if(S.role.assess)return 'Assessoria';
  return mine.length?'Gestor':'Sem vínculo';
}
function setReabs(rows){DB.reabFail=!rows;DB.reabs=(rows||[]).filter(r=>r.ANO&&r.COD_DPTO&&r.TRIMESTRE).map(r=>({Id:r.Id,ano:Number(r.ANO),cod:String(r.COD_DPTO),tri:String(r.TRIMESTRE),motivo:r.MOTIVO||'',ativo:!!r.ATIVO}));}
function setEx(rows){DB.ex={};rows.forEach(r=>{if(r.ANO)DB.ex[Number(r.ANO)]={Id:r.Id,status:r.STATUS||'Aberto',prazos:[r.PRAZO_Q1,r.PRAZO_Q2,r.PRAZO_Q3,r.PRAZO_Q4].map(x=>x?String(x).slice(0,10):''),enc:[r.ENCERRADO_Q1,r.ENCERRADO_Q2,r.ENCERRADO_Q3,r.ENCERRADO_Q4].map(x=>!!x)};});}
async function refreshData(){
  if(escrevendo())return;
  busy(true,'Atualizando…');
  try{
    await loadBase();
    S.dec={};
    setRoleLine();
    DB.real={};
    if(S.ano){await loadYear(S.ano,true);}
    if(S.aAno&&S.aAno!==S.ano)await loadYear(S.aAno,true);
    const _dupT=[...new Set([S.ano,S.aAno].filter(Boolean))].reduce((t,a)=>t+(((DB.dupPlan||{})[a])||0),0);
    const _avisos=[];
    if(_dupT)_avisos.push(`${_dupT} lançamento(s) duplicado(s) foram ignorados`);
    if(DB.reabFail)_avisos.push('as reaberturas não puderam ser carregadas');
    if(DB.confState==='error')_avisos.push('as políticas (08_Config) não puderam ser carregadas — envio e exclusão estão bloqueados');
    toast(_avisos.length?`Dados atualizados — mas ${_avisos.join(' e ')}. Avise a TI.`:'Dados atualizados.',_dupT?'err':DB.reabFail?'warn':undefined);
  }catch(e){console.error(e);logApp(e);toast('Não foi possível atualizar: '+String(e.message||e).split('\n')[0],'err');}
  finally{busy(false);render();}
}

/* ================================ BOOT ================================ */
function setRoleLine(){const s=document.querySelector('#ps-um small');if(s)s.textContent=roleLabel(myDepts())+(DB.me&&DB.me.email?' · '+DB.me.email:'');}
/* carrega cadastros, vínculos, exercícios, perfis e reaberturas (com os ETags) */
async function loadBase(){
  const [depts,ccs,cats,vincRows,exRows,perfRows,reabRows,confRows]=await Promise.all([
    getAll(CFG.lists.dept,'$select=Id,COD_DPTO,DESC_DPTO&$top=500'),
    getAll(CFG.lists.cc,'$select=Id,COD_CC,DESC_CC,COD_DPTO,GESTAO&$top=2000'),
    getAll(CFG.lists.cat,'$select=Id,COD_CAT,DESC_CAT&$top=2000'),
    getAll(CFG.lists.vinc,'$select=Id,ATIVO,DEPARTAMENTOId,GESTOR/Title,GESTOR/EMail&$expand=GESTOR&$top=2000'),
    getAll(CFG.lists.ex,'$select=Id,ANO,STATUS,PRAZO_Q1,PRAZO_Q2,PRAZO_Q3,PRAZO_Q4,ENCERRADO_Q1,ENCERRADO_Q2,ENCERRADO_Q3,ENCERRADO_Q4&$top=100'),
    getAll(CFG.lists.perfil,'$select=Id,ATIVO,PERFIL,PESSOA/EMail&$expand=PESSOA&$top=500').catch(()=>null),
    getAll(CFG.lists.reab,'$select=Id,ANO,COD_DPTO,TRIMESTRE,MOTIVO,ATIVO&$top=500').catch(()=>null),
    getAll(CFG.lists.config,'$select=Id,CHAVE,VALOR&$top=100').then(r=>({st:'ok',rows:r})).catch(()=>({st:'error',rows:null}))
  ]);
  setPerfis(perfRows);
  setCadastros(depts,ccs,cats);
  setVincs(vincRows);setEx(exRows);setReabs(reabRows);
  DB.conf=confRows.rows;DB.confState=confRows.st;   // produção fail-closed: qualquer falha (404 incluído) bloqueia envio/exclusão; padrão vale só para CHAVE ausente numa lista carregada
  recalcRole();
}
async function start(){
  PS.screens.loading('Carregando cadastros…');
  try{
    DB.me={email:acct.username.toLowerCase(),name:acct.name||acct.username};
    DB.me.uid=await ensureUser(DB.me.email);
    await loadBase();
    const mine=myDepts();

    const anos=ANOS();const nowY=new Date().getFullYear();
    S.ano=anos.includes(nowY)?nowY:(anos[anos.length-1]||null);
    S.aAno=S.ano;S.pAno=S.ano;
    if(!S.role.admin&&!mine.length)S.view='plan';
    if(S.ano){PS.screens.loading('Carregando planejamento…');await loadYear(S.ano);}

    /* shell compartilhado (menu, cabeçalho, conta, menu recolhível) */
    UI=PS.mount({app:'Planejamento',nav:buildNav(),current:S.view,onNav,account:acct});
    PS.auth.ready();
    UI.page.innerHTML='<div class="pagehead"><div><h1 id="vTitle"></h1><p id="vMeta"></p></div><span id="hActions" style="display:flex;gap:10px;align-items:center"></span></div>'+
      '<section id="view"></section>'+
      '<footer id="pfoot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Neste aplicativo, você vê apenas os departamentos liberados para o seu perfil. Precisa de acesso ou de um ajuste? Fale com a TI.<span style="margin-left:auto;white-space:nowrap" title="build '+APP_BUILD+'">Planejamento Orçamentário · v'+APP_VERSION+'</span></footer>';
    document.body.insertAdjacentHTML('beforeend','<div id="busy" hidden>Gravando…</div>'+
      '<div id="modal" hidden><div class="mback"></div><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mhead"><h2 id="mTitle"></h2><button class="btn ghost" id="mClose">Fechar</button></div><div class="mbody" id="mBody"></div></div></div>');
    const ta=document.querySelector('.ps-topact');
    if(ta)ta.insertAdjacentHTML('afterbegin','<button class="ps-iconbtn" id="btnRefresh" title="Recarregar os dados do SharePoint" aria-label="Atualizar">'+PS.icon('refresh')+'</button>');
    document.getElementById('btnRefresh').onclick=refreshData;
    document.getElementById('mClose').onclick=()=>document.getElementById('modal').hidden=true;
    document.querySelector('#modal .mback').onclick=()=>document.getElementById('modal').hidden=true;
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').hidden=true;});
    setRoleLine();
    if(!DB.perfis)toast('Não foi possível carregar os perfis de acesso — funções administrativas ficam ocultas. Avise a TI.','warn');
    else if(DB.reabFail)toast('Não foi possível carregar as reaberturas — reaberturas pontuais ficam desativadas. Avise a TI.','warn');
    if(DB.confState==='error')toast('Não foi possível carregar as políticas do aplicativo (08_Config) — envio e exclusão ficam bloqueados até recarregar. Avise a TI.','err');
    render();
  }catch(e){
    console.error(e);
    try{logApp(e);}catch(_){}
    PS.screens.error('Não foi possível carregar','Confira se as listas e permissões da Etapa 1 foram criadas.',{retry:true,details:[String((e&&e.message)||e).slice(0,300)]});
  }
}
(async function boot(){
  try{
    PS.screens.loading('Validando acesso…');
    acct=await PS.auth.init();
    if(!acct){PS.screens.login({app:'Planejamento Orçamentário',onLogin:()=>PS.auth.login(SCOPE_SP)});return;}
    await start();
  }catch(e){
    console.error(e);
    PS.screens.error('Falha na autenticação',String((e&&e.message)||e));
  }
})();
</script>
