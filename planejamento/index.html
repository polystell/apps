<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planejamento Orçamentário · Polystell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core/polystell.css?v=5">
<style>
/* =====================================================================
   PLANEJAMENTO ORÇAMENTÁRIO — estilos do app.
   Tema, shell (menu/cabeçalho), telas de entrada/carga e toast vêm de
   /core/polystell.css + /core/polystell.js. Aqui ficam só os componentes
   próprios deste app, TODOS sob o namespace :is(.ps-page,#modal) — nada
   aqui altera componentes do core nem de outros Polystell Apps.
   ===================================================================== */
/* tokens locais do app, escopados — nada entra no :root global do core
   (#busy fica fora de .ps-page, por isso entra na lista) */
.ps-page,#modal,#busy{
  --panel:var(--surface); --soft:#F3F4F8; --mute:var(--muted);
  --primary:var(--blue); --primary-ink:#FFFFFF; --primary-soft:var(--blue-soft);
  --ok:#2A7F36; --ok-soft:#E3F2E5;
  --warn:#7E5C00; --warn-soft:#FFF2C7;
  --bad:#B81F46; --bad-soft:#FBE4EA;
  --draft:#5E6372; --draft-soft:#ECEDF2;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* dentro do app, campos voltam ao dimensionamento próprio (fora dele, o core manda) */
:is(.ps-page,#modal) :is(input[type=text],input[type=search],input[type=number],input[type=tel],input[type=email],input[type=date],input[type=time],input:not([type]),select,textarea){width:auto;min-height:0;font-size:inherit}
.ps-page{display:flex;flex-direction:column}
:is(.ps-page,#modal) .code{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}

#view{display:flex;flex-direction:column;gap:14px}
.ps-page .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ps-page .pagehead h1{font-size:26px;font-weight:650;letter-spacing:-.7px;margin:0;line-height:1.25}
.ps-page .pagehead p{margin:5px 0 0;font-size:14px;color:var(--mute)}
.ps-page .pagehead p:empty{display:none}
:is(.ps-page,#modal) .meta{font-size:12px;color:var(--mute)}
:is(.ps-page,#modal) .panel{background:var(--panel);border:0;border-radius:14px;padding:18px 20px;margin:0;box-shadow:0 2px 10px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:14px;min-width:0}
:is(.ps-page,#modal) .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:0;padding:0}
:is(.ps-page,#modal) .row .meta{font-size:12px;margin:0}

:is(.ps-page,#modal) .tabs{display:flex;flex-wrap:wrap;gap:8px}
:is(.ps-page,#modal) .tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
:is(.ps-page,#modal) .tab[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}

:is(.ps-page,#modal) .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
:is(.ps-page,#modal) .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column-reverse;gap:2px}
:is(.ps-page,#modal) .stat span{display:block;font-size:13px;color:var(--mute)}
:is(.ps-page,#modal) .stat b{font-size:24px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.2}
:is(.ps-page,#modal) .stat b.neg{color:var(--bad)}

:is(.ps-page,#modal) .prazos{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px}
:is(.ps-page,#modal) .prazos>span:first-child{color:var(--mute);margin-right:4px}
:is(.ps-page,#modal) .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
:is(.ps-page,#modal) .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
:is(.ps-page,#modal) .c-ok{background:var(--ok-soft);color:var(--ok)}
:is(.ps-page,#modal) .c-bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
:is(.ps-page,#modal) .c-draft{background:var(--draft-soft);color:var(--draft)}

:is(.ps-page,#modal) .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0}
:is(.ps-page,#modal) .seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
:is(.ps-page,#modal) .seg button{padding:6px 14px;background:transparent;border:0;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink);min-height:0}
:is(.ps-page,#modal) .seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:600;box-shadow:0 1px 4px rgba(33,65,162,.35)}
:is(.ps-page,#modal) .actions{display:flex;flex-wrap:wrap;gap:8px}
:is(.ps-page,#modal) .btn{border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);border-radius:10px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;min-height:0}
:is(.ps-page,#modal) .btn:hover:not(:disabled){background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
:is(.ps-page,#modal) .btn.ghost{background:var(--panel);color:var(--primary);border-color:var(--primary)}
:is(.ps-page,#modal) .btn.ghost:hover:not(:disabled){background:var(--panel);border-color:var(--primary);color:var(--primary)}
:is(.ps-page,#modal) .btn:disabled{opacity:.45;cursor:not-allowed}
:is(.ps-page,#modal) :is(button,select,textarea,input):focus-visible{outline:2px solid var(--primary);outline-offset:2px}
:is(.ps-page,#modal) .lnk{background:none;border:0;padding:0;color:var(--primary);font-size:11px;font-weight:600;cursor:pointer}
:is(.ps-page,#modal) .lnk:hover{text-decoration:underline}

:is(.ps-page,#modal) .tool{background:var(--primary-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
:is(.ps-page,#modal) .tool h2{margin:0;font-size:14px}
:is(.ps-page,#modal) .tool .line{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
:is(.ps-page,#modal) .tool :is(input[type="text"],input[type="email"],textarea,select){padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
:is(.ps-page,#modal) .tool textarea{width:100%;min-height:64px;resize:vertical}
:is(.ps-page,#modal) .tool input[type="file"]{max-width:100%}

:is(.ps-page,#modal) .additem{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;align-items:end;background:var(--soft);border-radius:12px;padding:18px}
:is(.ps-page,#modal) .additem label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
:is(.ps-page,#modal) .additem :is(select,input){padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);min-width:0;width:100%}
:is(.ps-page,#modal) .formbtns{display:flex;gap:8px}
:is(.ps-page,#modal) .hint{font-size:12px;color:var(--mute);margin:0}
:is(.ps-page,#modal) .additem .hint,:is(.ps-page,#modal) .additem .wide{grid-column:1/-1}

:is(.ps-page,#modal) .gridwrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px}
:is(.ps-page,#modal) table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
:is(.ps-page,#modal) .grid th,:is(.ps-page,#modal) .grid td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
:is(.ps-page,#modal) .grid thead th{position:sticky;top:0;z-index:3;background:var(--panel);font-size:10.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--line)}
:is(.ps-page,#modal) .grid thead tr:first-child th{height:38px}
:is(.ps-page,#modal) .grid thead tr:nth-child(2) th{top:38px}
:is(.ps-page,#modal) .grid tbody tr:not(.grp):hover td.item{background:var(--soft)}
:is(.ps-page,#modal) .grid .item{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;min-width:240px;max-width:280px;white-space:normal;border-right:1px solid var(--line)}
:is(.ps-page,#modal) .grid thead .item{background:var(--panel);z-index:5}
:is(.ps-page,#modal) .catline{display:block;font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.35}
:is(.ps-page,#modal) .catline .code{color:var(--ink);opacity:.65}
:is(.ps-page,#modal) .detline{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
:is(.ps-page,#modal) .sub{display:block;font-size:11px;color:var(--mute)}
:is(.ps-page,#modal) .obs{display:block;font-size:11px;font-style:italic;color:var(--mute);margin-top:2px}
:is(.ps-page,#modal) .rowact{display:flex;gap:12px;margin-top:4px;opacity:0;transition:opacity .15s ease}
:is(.ps-page,#modal) tr:hover .rowact,:is(.ps-page,#modal) .rowact:focus-within{opacity:1}
@media (hover:none){:is(.ps-page,#modal) .rowact{opacity:1}}
:is(.ps-page,#modal) .grid .qh{text-align:center;border-left:2px solid var(--line)}
:is(.ps-page,#modal) .grid .qh .pill{margin-left:6px;vertical-align:1px}
:is(.ps-page,#modal) .grid .mh{text-align:right}
:is(.ps-page,#modal) .grid .qs{border-left:2px solid var(--line)}
:is(.ps-page,#modal) .grid .tot{text-align:right;font-weight:600;border-left:1px solid var(--line)}
:is(.ps-page,#modal) .grid tr.grp td{background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:11.5px;letter-spacing:.04em}
:is(.ps-page,#modal) .grid tr.grp td.item{background:var(--primary-soft)}
:is(.ps-page,#modal) .grpdesc{display:block;line-height:1.25}
:is(.ps-page,#modal) .grid tr.grp .code{display:block;font-size:10px;color:var(--primary);opacity:.55;letter-spacing:.06em;margin-top:2px}
:is(.ps-page,#modal) .grid tfoot td{background:var(--soft);font-weight:700;text-align:right}
:is(.ps-page,#modal) .grid tfoot td.item{background:var(--soft);text-align:left}
:is(.ps-page,#modal) .grid td.c{padding:3px 4px;text-align:right;position:relative}
:is(.ps-page,#modal) .grid td.c input{width:78px;text-align:right;border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 6px}
:is(.ps-page,#modal) .grid td.c input:hover:not(:disabled){border-color:var(--line);background:var(--panel)}
:is(.ps-page,#modal) .grid td.c input:focus{outline:2px solid var(--primary);outline-offset:-1px;background:var(--panel);border-color:transparent;box-shadow:none}
:is(.ps-page,#modal) .grid td.c input:disabled{color:var(--ink)}
:is(.ps-page,#modal) .s-Pendente{background:var(--warn-soft)}
:is(.ps-page,#modal) .s-Aprovado{background:var(--ok-soft)}
:is(.ps-page,#modal) .s-Reprovado{background:var(--bad-soft)}
:is(.ps-page,#modal) .grid td.cut::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent var(--warn) transparent transparent}
:is(.ps-page,#modal) .empty{padding:28px;text-align:center;color:var(--mute);white-space:normal!important;font-size:inherit}

:is(.ps-page,#modal) .grid td.r{text-align:right;vertical-align:top;padding:5px 8px}
:is(.ps-page,#modal) .rv{font-weight:600}
:is(.ps-page,#modal) .av{font-size:11px;color:var(--mute)}
:is(.ps-page,#modal) .grid td.over{background:var(--bad-soft)}
:is(.ps-page,#modal) .grid td.over .rv{color:var(--bad)}
:is(.ps-page,#modal) .grid td.fut .rv{color:var(--mute);font-weight:400}
:is(.ps-page,#modal) .unpl{color:var(--bad);font-weight:600}

:is(.ps-page,#modal) .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:1px 8px;border-radius:999px;text-transform:none}
:is(.ps-page,#modal) .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
:is(.ps-page,#modal) .p-Rascunho{background:var(--draft-soft);color:var(--draft)}
:is(.ps-page,#modal) .p-Pendente,:is(.ps-page,#modal) .p-Parcial{background:var(--warn-soft);color:var(--warn)}
:is(.ps-page,#modal) .p-Aprovado{background:var(--ok-soft);color:var(--ok)}
:is(.ps-page,#modal) .p-Reprovado{background:var(--bad-soft);color:var(--bad)}
:is(.ps-page,#modal) .legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--mute)}
:is(.ps-page,#modal) .legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}

:is(.ps-page,#modal) .split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
:is(.ps-page,#modal) .dlist{display:flex;flex-direction:column;gap:6px}
:is(.ps-page,#modal) .dbtn{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer}
:is(.ps-page,#modal) .dbtn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
:is(.ps-page,#modal) .dbtn b{display:block;font-size:13px}
:is(.ps-page,#modal) .dbtn .sub{font-variant-numeric:tabular-nums}
:is(.ps-page,#modal) table.ap{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
:is(.ps-page,#modal) .gridwrap .ap thead th{position:sticky;top:0;z-index:2}
:is(.ps-page,#modal) .gridwrap .simple thead th{position:sticky;top:0;z-index:2;background:var(--panel)}
:is(.ps-page,#modal) .ap th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);background:var(--soft)}
:is(.ps-page,#modal) .ap td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
:is(.ps-page,#modal) .ap .num{text-align:right;white-space:nowrap}
:is(.ps-page,#modal) .ap input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
:is(.ps-page,#modal) .ap input.aval{width:110px;text-align:right}
:is(.ps-page,#modal) .ap input.amot{width:100%;min-width:200px}
:is(.ps-page,#modal) .ap input.req{border-color:var(--bad)}
:is(.ps-page,#modal) .dec{display:flex;gap:6px;flex-wrap:wrap}
:is(.ps-page,#modal) .dec button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
:is(.ps-page,#modal) .dec .yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
:is(.ps-page,#modal) .dec .no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--panel)}
:is(.ps-page,#modal) .afoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}

:is(.ps-page,#modal) table.simple{border-collapse:collapse;width:100%;font-size:13px}
:is(.ps-page,#modal) .simple th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px;border-bottom:1px solid var(--line)}
:is(.ps-page,#modal) .simple td{padding:10px 8px;border-bottom:1px solid var(--line)}
:is(.ps-page,#modal) .simple input[type="date"]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
:is(.ps-page,#modal) .muted{color:var(--mute)}
:is(.ps-page,#modal) .warnline{color:var(--bad);font-weight:600}

:is(.ps-page,#modal) tr.mesrow td{background:var(--soft);padding:14px 10px;border-bottom:2px solid var(--line)}
:is(.ps-page,#modal) .mgrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
:is(.ps-page,#modal) .mcell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;background:var(--panel);min-width:160px;max-width:200px}
:is(.ps-page,#modal) .mcell b{font-size:12px}
:is(.ps-page,#modal) .mcell.ok{background:var(--ok-soft);border-color:var(--ok)}
:is(.ps-page,#modal) .mcell.no{background:var(--bad-soft);border-color:var(--bad)}
:is(.ps-page,#modal) .mcell input{width:100%;text-align:right;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
:is(.ps-page,#modal) .mcell .dec button{padding:4px 10px}
:is(.ps-page,#modal) .mcell .mmot{text-align:left;font-size:12px}
:is(.ps-page,#modal) .mcell .mmot.req{border-color:var(--bad);background:#fff5f5}

#busy{position:fixed;right:24px;bottom:20px;background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:40}
#busy[hidden]{display:none}
#pfoot{margin-top:auto;padding:18px 2px 0;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px}
#pfoot svg{width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

:is(.ps-page,#modal) td.r.click{cursor:pointer}
:is(.ps-page,#modal) td.r.click:hover .rv{text-decoration:underline}
#modal{position:fixed;inset:0;z-index:250}
#modal .mback{position:absolute;inset:0;background:rgba(13,26,65,.45)}
#modal .mcard{position:relative;margin:6vh auto 0;max-width:800px;width:calc(100% - 32px);background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:84vh}
#modal .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
#modal .mhead h2{font-size:15px;font-weight:700}
#modal .mbody{padding:8px 20px 20px;overflow:auto}
:is(.ps-page,#modal) :is(.btn,.tab,.seg button,.dec button,.dbtn,.lnk){transition:background .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease}
@media (max-width:900px){:is(.ps-page,#modal) .additem{grid-template-columns:1fr}}
@media (max-width:820px){:is(.ps-page,#modal) .split{grid-template-columns:1fr}#busy{bottom:72px}}
@media (prefers-reduced-motion:reduce){:is(.ps-page,#modal) :is(.rowact,.btn,.tab,.seg button,.dec button,.dbtn,.lnk){transition:none}}
</style>

<script src="/core/polystell.js?v=5"></script>

<script>
'use strict';
/* =====================================================================
   CONFIGURAÇÃO — Polystell (Client ID e Tenant ID são identificadores
   públicos do App Registration; não são segredos)
===================================================================== */
const CFG={
  spHost:'https://'+PS.cfg.siteHost,   // mesma origem configurada no core
  sitePath:PS.cfg.sitePath,
  realLib:'08_Realizado',                       // biblioteca: 1 arquivo JSON por departamento/ano
  lists:{
    plan:'08_Planejamento',
    vinc:'08_Gestor_Departamento',
    ex:'08_Exercicios',
    dept:'98_Cadastro_Departamento',
    cc:'98_Cadastro_Centro_Custo',
    cat:'98_Cadastro_Categoria_Financeira',
    perfil:'08_Perfis',                         // papéis: Administrador / Aprovador / Assessoria (dados, não código)
    reab:'08_Reaberturas',                      // reaberturas pontuais por departamento/trimestre
    config:'08_Config',                         // parâmetros de comportamento (tela Segurança) — dados, não código
    log:'08_Log_App'                            // log técnico de erros (best effort — nunca atrapalha o usuário)
  }
};

const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const QLAB=['1º tri','2º tri','3º tri','4º tri'];

/* ============================ AUTENTICAÇÃO ============================ */
const SCOPE_SP=[CFG.spHost+'/AllSites.Write'];
let acct=null;   // conta autenticada (PS.auth); token e transporte ficam no core (PS.sprest)

/* ========================= CAMADA SHAREPOINT ========================= */
/* Concorrência otimista: cada item carrega o seu ETag (versão). Toda gravação
   envia If-Match com essa versão; se alguém alterou o registro nesse meio
   tempo, o SharePoint responde 412 e recarregamos em vez de sobrescrever. */
const API=CFG.spHost+CFG.sitePath+'/_api/';
const ETAGS={};
const tagKey=(list,id)=>list+'|'+id;
const bumpTag=(list,id)=>{const k=tagKey(list,id);const m=/(\d+)/.exec(ETAGS[k]||'');if(m)ETAGS[k]='"'+(Number(m[1])+1)+'"';else delete ETAGS[k];};
async function sp(path,opt={}){
  /* gravar sem versão conhecida NUNCA cai para "*": recarrega e tenta de novo (fail closed) */
  if((opt.merge||opt.del)&&!opt.etag)throw Object.assign(new Error('A versão deste registro não está disponível — recarregando os dados; tente novamente.'),{status:412});
  const headers={Accept:'application/json;odata=minimalmetadata','Content-Type':opt.ctype||'application/json;odata=nometadata'};

  /* transporte resiliente do core: timeout, retry seguro, renovação de token */
  const res=await PS.sprest(path.startsWith('http')?path:API+path,{method:opt.method||'GET',headers,body:opt.body!==undefined?JSON.stringify(opt.body):undefined,scopes:SCOPE_SP});
  if(res.status===412)throw Object.assign(new Error('O registro foi alterado por outra pessoa enquanto você editava (412).'),{status:412,requestId:res.headers.get('SPRequestGuid')||res.headers.get('request-id')||''});

    throw Object.assign(new Error(`HTTP ${res.status} em ${path}\n${d}`),{status:res.status,requestId:res.headers.get('SPRequestGuid')||res.headers.get('request-id')||''});}

  const ro=closed||!meus.includes(S.dept);
  setHead(`Planejamento ${S.ano}`,closed?'Exercício encerrado':'');
  const its=itemsOf(S.ano,S.dept);
  const ms=monthsOf(S.scope);
  const sumIf=f=>its.reduce((a,i)=>a+i.prev.reduce((b,v,m)=>b+(v>0&&f(i,m)?v:0),0),0);
  const totApr=its.reduce((a,i)=>a+i.apr.reduce((b,v,m)=>b+(i.st[m]==='Aprovado'&&v?v:0),0),0);
  const draftIn=its.some(i=>ms.some(m=>mOpen(S.ano,m)&&i.prev[m]>0&&i.st[m]==='Rascunho'));
  const srcYears=ANOS().filter(a=>a<S.ano&&(DB.plan[a]===undefined||(DB.plan[a]||[]).some(i=>i.dept===S.dept)));
  const quarters=S.scope==='ANO'?[0,1,2,3]:[S.scope];
  const scopeName=S.scope==='ANO'?'o ano':'o '+QLAB[S.scope];

  let h=`<div class="row">${deptTabs(deps)}<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${closed?'<span class="chip c-draft">Exercício encerrado</span>':''}${rq.length?`<span class="chip c-ok">Reaberto: ${rq.map(q=>QLAB[q]).join(', ')}</span>`:''}${yearSeg(S.ano,'data-ano')}</span></div>`;
  h+=`<div class="stats">
    <div class="stat"><span>Previsto no ano</span><b>${money(sumIf(()=>true))}</b></div>
    <div class="stat"><span>Aprovado</span><b>${money(totApr)}</b></div>
    <div class="stat"><span>Aguardando diretoria</span><b>${money(sumIf((i,m)=>i.st[m]==='Pendente'))}</b></div>
    <div class="stat"><span>Em rascunho</span><b>${money(sumIf((i,m)=>i.st[m]==='Rascunho'))}</b></div></div>`;
  if(DB.ex[S.ano])h+=`<div class="prazos"><span>Prazos de envio</span>${[0,1,2,3].map(q=>{const p=prazoStatus(S.dept,S.ano,q);return `<span class="chip c-${p.c}">${QLAB[q]} · até ${fmtD(DB.ex[S.ano].prazos[q])} · ${p.s}</span>`;}).join('')}</div>`;
  h+=`<div class="toolbar"><div class="seg" role="group" aria-label="Período">${['ANO',0,1,2,3].map(sc=>`<button data-scope="${sc}" aria-pressed="${S.scope===sc}">${sc==='ANO'?'Ano':QLAB[sc]}</button>`).join('')}</div>`;
  if(!ro){
    h+=`<div class="actions"><button class="btn ghost" id="addBtn">+ Novo item</button><button class="btn ghost" id="impBtn">Importar planilha</button>`;
    if(srcYears.length)h+=`<button class="btn ghost" id="copyBtn">Copiar de outro ano</button>`;
    h+=`<button class="btn" id="sendBtn" ${draftIn?'':'disabled'}>Enviar ${scopeName} para aprovação</button></div>`;
  }
  h+=`</div>`;
  if(!ro)h+=toolHtml();
  if(S.adding&&!ro){
    const myCCs=DB.ccs.filter(c=>c.COD_DPTO===S.dept);
    h+=`<form class="additem" id="addForm">
      <label for="fCC">Centro de custo<input id="fCC" list="dlCC" placeholder="Pesquise por código ou nome" autocomplete="off"><datalist id="dlCC">${myCCs.map(c=>`<option value="${c.COD_CC} - ${esc(c.DESC_CC)}"></option>`).join('')}</datalist></label>
      <label for="fCat">Categoria financeira<input id="fCat" list="dlCat" placeholder="Pesquise por código ou nome" autocomplete="off"><datalist id="dlCat">${DB.cats.map(c=>`<option value="${c.COD_CAT} - ${esc(c.DESC_CAT)}"></option>`).join('')}</datalist></label>
      <label for="fDet">Detalhamento<input id="fDet" placeholder="Ex.: Microsoft 365" autocomplete="off" maxlength="120"></label>
      <label for="fObs" class="wide">Observação para a diretoria (opcional)<input id="fObs" placeholder="Ex.: renovação do contrato, reajuste de 8%" autocomplete="off"></label>
      <div class="formbtns"><button type="submit" class="btn">Adicionar</button><button type="button" class="btn ghost" id="cancelAdd">Cancelar</button></div>
</form>`;
  }

  let t=`<div class="gridwrap"><table class="grid"><thead><tr><th class="item" rowspan="2">Item</th>`;
  quarters.forEach(q=>{t+=`<th class="qh" colspan="3">${QLAB[q]}${pill(qStatus(its,[q*3,q*3+1,q*3+2]))}</th>`;});
  t+=`<th class="tot" rowspan="2">Total</th></tr><tr>`;
  ms.forEach(m=>{t+=`<th class="mh ${m%3===0?'qs':''}">${MES[m]}</th>`;});
  t+=`</tr></thead><tbody>`;
  if(!its.length){t+=`<tr><td class="empty" colspan="${ms.length+2}">Nenhum item em ${S.ano}.${ro?'':(srcYears.length?' Use “Copiar de outro ano” para trazer os recorrentes,':'')+' “Importar planilha” ou “Novo item”.'}</td></tr>`;}
  [...new Set(its.map(i=>i.cc))].sort().forEach(cc=>{
    const g=its.filter(i=>i.cc===cc);
    const sub=g.reduce((a,i)=>a+ms.reduce((b,m)=>b+vig(i,m),0),0);
    t+=`<tr class="grp"><td class="item"><span class="grpdesc">${esc(ccDesc(cc)||cc)}</span><span class="code">${cc}</span></td><td colspan="${ms.length}"></td><td class="tot">${money(sub)}</td></tr>`;
    g.forEach(i=>{
      const rt=ms.reduce((b,m)=>b+vig(i,m),0);
      const temDec=i.st.some((st,m)=>i.prev[m]>0&&(st==='Aprovado'||st==='Reprovado'));
      const temPen=ms.some(m=>i.prev[m]>0&&i.st[m]==='Pendente'&&mOpen(S.ano,m));
      const temRep=ms.some(m=>i.prev[m]>0&&i.st[m]==='Reprovado'&&mOpen(S.ano,m));
      t+=`<tr><td class="item"><span class="catline"><span class="code">${i.cat}</span> - ${esc(catDesc(i.cat))}</span><span class="detline">${esc(i.det)}</span>${i.obs?`<span class="obs">${esc(i.obs)}</span>`:''}${ro?'':`<span class="rowact"><button class="lnk" data-fill="${esc(i.key)}">Preencher</button>${temDec?'':`<button class="lnk" data-obs="${esc(i.key)}">${i.obs?'Editar observação':'Observação'}</button>`}${temPen?`<button class="lnk" data-cenv="${esc(i.key)}">Cancelar envio</button>`:''}${temRep?`<button class="lnk" data-reab="${esc(i.key)}">Reabrir reprovados</button>`:''}<button class="lnk" data-del="${esc(i.key)}" style="color:var(--bad)">Excluir</button></span>`}</td>`;
      ms.forEach(m=>{
        const s=i.prev[m]>0?i.st[m]:'';
        const ap=s==='Aprovado'&&i.apr[m]!=null;
        const show=ap?i.apr[m]:i.prev[m];
        const cut=ap&&Math.abs(i.apr[m]-i.prev[m])>0.005;
        const mot=i.mot[m]?' · '+i.mot[m]:'';
        const tip=ap?`Aprovado · ${money(i.apr[m])}${cut?` (pedido ${money(i.prev[m])})`:''}${mot}`:s==='Reprovado'?`Reprovado${mot}`:s;
        t+=`<td class="c ${m%3===0?'qs':''} ${s?'s-'+s:''} ${cut?'cut':''}" title="${esc(tip)}"><input data-key="${esc(i.key)}-${m}" data-ikey="${esc(i.key)}" data-m="${m}" inputmode="decimal" value="${show?fmt(show):''}" ${(ro||!mOpen(S.ano,m))?'disabled':''} aria-label="${esc(i.det)} – ${MES[m]}"></td>`;
      });
      t+=`<td class="tot">${money(rt)}</td></tr>`;
    });
  });
  t+=`</tbody><tfoot><tr><td class="item">Total · ${esc(deptName(S.dept))}</td>`;
  ms.forEach(m=>{t+=`<td class="${m%3===0?'qs':''}">${fmt(its.reduce((a,i)=>a+vig(i,m),0))}</td>`;});
  t+=`<td class="tot">${money(its.reduce((a,i)=>a+ms.reduce((b,m)=>b+vig(i,m),0),0))}</td></tr></tfoot></table></div>`;
  h+=t;
  h+=`<div class="legend"><span><i class="sw" style="background:var(--panel)"></i>Rascunho</span><span><i class="sw" style="background:var(--warn-soft)"></i>Aguardando diretoria</span><span><i class="sw" style="background:var(--ok-soft)"></i>Aprovado</span><span><i class="sw" style="background:var(--bad-soft)"></i>Reprovado</span><span><i class="sw" style="background:linear-gradient(225deg,var(--warn) 30%,var(--panel) 30%)"></i>Aprovado com ajuste — mostra o valor da diretoria (passe o mouse para ver o pedido e o motivo)</span></div>`;

  const v=document.getElementById('view');
  v.innerHTML=`<div class="panel">${h}</div>`;
  bindDeptTabs(v);
  v.querySelectorAll('[data-ano]').forEach(b=>b.onclick=async()=>{S.ano=Number(b.dataset.ano);S.tool=null;S.adding=false;try{await loadYear(S.ano);}catch(e){fail(e);}render();});
  v.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{const x=b.dataset.scope;S.scope=x==='ANO'?'ANO':Number(x);render();});
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  on('addBtn',()=>{S.adding=true;S.tool=null;render();document.getElementById('fDet').focus();});
  on('impBtn',()=>{S.tool={kind:'imp'};S.adding=false;render();});
  on('copyBtn',()=>{S.tool={kind:'copy',src:null};S.adding=false;render();});
  on('sendBtn',sendScope);
  on('cancelAdd',()=>{S.adding=false;render();});
  const fm=document.getElementById('addForm');if(fm)fm.onsubmit=e=>{e.preventDefault();addNewItem();};
  v.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{S.tool={kind:'fill',key:b.dataset.fill,mode:'rep'};S.adding=false;render();window.scrollTo({top:0,behavior:'smooth'});const x=document.getElementById('tVal');if(x)x.focus();});
  v.querySelectorAll('[data-obs]').forEach(b=>b.onclick=()=>{S.tool={kind:'obs',key:b.dataset.obs};S.adding=false;render();window.scrollTo({top:0,behavior:'smooth'});const x=document.getElementById('tObs');if(x)x.focus();});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tool={kind:'del',key:b.dataset.del};S.adding=false;render();window.scrollTo({top:0,behavior:'smooth'});});
  v.querySelectorAll('[data-cenv]').forEach(b=>b.onclick=()=>setMonthsStatus(b.dataset.cenv,'Pendente'));
  v.querySelectorAll('[data-reab]').forEach(b=>b.onclick=()=>setMonthsStatus(b.dataset.reab,'Reprovado'));
  bindTool();
  v.querySelectorAll('td.c input').forEach(inp=>{
    inp.onfocus=()=>inp.select();
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
    inp.onchange=()=>editCell(inp.dataset.ikey,+inp.dataset.m,parse(inp.value));
  });
}

/* ---- painel de ferramentas ---- */
const findItem=key=>(DB.plan[S.ano]||[]).find(i=>i.key===key);
function toolHtml(){
  const T=S.tool;if(!T)return '';
  const scopeName=S.scope==='ANO'?'no ano inteiro':'no '+QLAB[S.scope];
  if(T.kind==='fill'){
    const it=findItem(T.key);if(!it)return '';
    return `<div class="tool" role="region" aria-label="Preencher linha"><h2>Preencher “${esc(it.det)}” ${scopeName}</h2>
      <div class="line"><div class="seg" role="group" aria-label="Forma de preencher"><button data-mode="rep" aria-pressed="${T.mode==='rep'}">Repetir valor mensal</button><button data-mode="dist" aria-pressed="${T.mode==='dist'}">Distribuir um total no período</button></div>
      <label for="tVal" class="hint">${T.mode==='rep'?'Valor por mês (R$)':'Total a distribuir (R$)'}</label><input type="text" id="tVal" inputmode="decimal" placeholder="${T.mode==='rep'?'3.300':'39.600'}">
      <button class="btn" id="tApply">Aplicar</button><button class="btn ghost" id="tCancel">Fechar</button></div>
      <p class="hint">Este painel é só um atalho — para lançar um único mês, feche e digite o valor direto na célula do mês. Nada do item é perdido ao fechar.</p>
</div>`;
  }
  if(T.kind==='obs'){
    const it=findItem(T.key);if(!it)return '';
    return `<div class="tool" role="region" aria-label="Observação do item"><h2>Observação de “${esc(it.det)}”</h2>
      <textarea id="tObs" placeholder="Explique para a diretoria por que esse valor é necessário">${esc(it.obs)}</textarea>
      <div class="line"><button class="btn" id="tSaveObs">Salvar observação</button><button class="btn ghost" id="tCancel">Cancelar</button></div>
</div>`;
  }
  if(T.kind==='del'){
    const it=findItem(T.key);if(!it)return '';
    const temDecisao=it.st.some((st,m)=>it.prev[m]>0&&(st==='Aprovado'||st==='Reprovado'));
    const temPend=it.st.some((st,m)=>it.prev[m]>0&&st==='Pendente');
    const temFechado=it.ids.some((id,m)=>id&&!mOpen(S.ano,m));
    const travaConf=confSN('BLOQUEAR_EXCLUSAO_COM_LANCAMENTO')&&it.ids.some(Boolean);
    if(temDecisao||temPend||temFechado||travaConf){
      return `<div class="tool" role="region" aria-label="Excluir item"><h2>Não dá para excluir “${esc(it.det)}”</h2>
        <p class="hint warnline">${temDecisao?'O item já tem mês aprovado ou reprovado pela diretoria — ajuste os valores (o mês volta para aprovação) em vez de excluir.':temPend?'O item está aguardando a diretoria — use “Cancelar envio” e depois exclua.':temFechado?'O item tem lançamento em trimestre encerrado — reabra o trimestre em Exercícios e prazos antes de excluir.':'A exclusão de itens com lançamento gravado está bloqueada (tela Segurança). Zere os valores ou peça à TI.'}</p>
        <div class="line"><button class="btn ghost" id="tCancel">Fechar</button></div></div>`;
    }
    const n=it.ids.filter(Boolean).length;
    return `<div class="tool" role="region" aria-label="Excluir item"><h2>Excluir “${esc(it.det)}” de ${S.ano}?</h2>
      <p class="hint">${n?`Serão removidas ${n} linha(s) gravadas.`:'Nada foi gravado ainda.'}</p>
      <div class="line"><button class="btn" id="tDelGo" style="background:var(--bad);border-color:var(--bad)">Excluir item</button><button class="btn ghost" id="tCancel">Cancelar</button></div></div>`;
  }
  if(T.kind==='copy'){
    const srcYears=ANOS().filter(a=>a<S.ano&&(DB.plan[a]===undefined||(DB.plan[a]||[]).some(i=>i.dept===S.dept)));
    const sel=T.src&&srcYears.includes(T.src)?T.src:srcYears[srcYears.length-1];
    return `<div class="tool" role="region" aria-label="Copiar de outro exercício"><h2>Copiar itens para ${S.ano}</h2>
      <div class="line"><label for="tSrc" class="hint">Copiar do exercício</label><select id="tSrc">${srcYears.map(a=>`<option ${a===sel?'selected':''}>${a}</option>`).join('')}</select>
      <button class="btn" id="tCopyGo">Copiar como rascunho</button><button class="btn ghost" id="tCancel">Cancelar</button></div>
</div>`;
  }
  if(T.kind==='imp'){
    let h=`<div class="tool" role="region" aria-label="Importar planilha"><h2>Importar planilha de planejamento</h2>
      <div class="line"><button class="btn ghost" id="tModelo">⬇ Baixar modelo (${esc(deptName(S.dept))})</button><input type="file" id="tFile" accept=".xlsx,.xls" aria-label="Arquivo Excel"><button class="btn ghost" id="tCancel">Fechar</button></div>`;
    if(S.imp){
      const I=S.imp;
      if(I.error)h+=`<p class="warnline">${esc(I.error)}</p>`;
      else{
        const names=Object.keys(I.sheets);
        if(names.length>1)h+=`<div class="line"><label for="tSheet" class="hint">Aba</label><select id="tSheet">${names.map(n=>`<option ${n===I.sel?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
        const pv=impPreview();
        h+=`<p><b>${esc(I.file)}</b> · aba “${esc(I.sel)}”: ${pv.found} itens com valor · <b>${pv.novos.length} novos</b>${pv.compl.length?` · ${pv.compl.length} só com meses a completar`:''}${pv.dup?` · ${pv.dup} já existem`:''}${pv.outro?` · ${pv.outro} de outro departamento`:''}${pv.inval?` · <span class="warnline">${pv.inval} com código que não existe no cadastro do ERP (ignorados)</span>`:''}${pv.soFech?` · ${pv.soFech} só com valores em períodos encerrados (ignorados)`:''} · total a importar <b>${money(pv.total)}</b>${pv.fech?` · <span class="warnline">${money(pv.fech)} em trimestre(s) encerrado(s) serão ignorados</span>`:''}</p>`;
        if(pv.novos.length||pv.compl.length)h+=`<div class="line"><button class="btn" id="tImport">${pv.novos.length?`Importar ${pv.novos.length} ${plural(pv.novos.length,'item novo','itens novos')}`:''}${pv.novos.length&&pv.compl.length?' e ':''}${pv.compl.length?`${pv.novos.length?'c':'C'}ompletar ${pv.compl.length} ${plural(pv.compl.length,'item','itens')}`:''}</button></div>`;
      }
    }
    return h+`</div>`;
  }
  return '';
}
function bindTool(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
  on('tCancel',()=>{S.tool=null;S.imp=null;render();});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.tool.mode=b.dataset.mode;render();document.getElementById('tVal').focus();});
  on('tApply',()=>applyFill(parse(document.getElementById('tVal').value)));
  const tv=document.getElementById('tVal');if(tv)tv.onkeydown=e=>{if(e.key==='Enter')applyFill(parse(tv.value));};
  const ts=document.getElementById('tSrc');if(ts)ts.onchange=()=>{S.tool.src=Number(ts.value);};
  on('tCopyGo',()=>{const e=document.getElementById('tSrc');copyFrom(Number(e.value));});
  on('tSaveObs',saveObs);
  on('tDelGo',doDelete);
  on('tModelo',baixarModelo);
  const f=document.getElementById('tFile');if(f)f.onchange=()=>{if(f.files[0])readFile(f.files[0]);};
  const sh=document.getElementById('tSheet');if(sh)sh.onchange=()=>{S.imp.sel=sh.value;render();};
  on('tImport',doImport);
}

/* ---- gravações do planejamento ---- */
function baseFields(it,m,ano){
  return {
    Title:`${it.det} · ${MES[m]}/${ano}`,
    CHAVE_ITEM:`${ano}-${String(m+1).padStart(2,'0')}-${it.cc}-${it.cat}-${it.det}`,
    COD_DPTO:it.dept,
    ANO:String(ano),
    COMPETENCIA:locDate(ano,m),
    TRIMESTRE:'Q'+(Math.floor(m/3)+1),
    COD_CC:it.cc, DESC_CC:ccDesc(it.cc)||it.cc,
    COD_CAT:it.cat, DESC_CAT:catDesc(it.cat)||it.cat,
    DETALHAMENTO:it.det,
    OBSERVACAO:it.obs||'',
    PREVISTO:locNum(it.prev[m]),
    STATUS:it.st[m]
  };
}
async function persistCell(it,m,ano){
  if(it.ids[m]){
    await mergeItem(CFG.lists.plan,it.ids[m],{PREVISTO:it.prev[m],STATUS:it.st[m],APROVADO:null,MOTIVO:'',DATA_APROVACAO:null,APROVADO_PORId:null});
  }else if(it.prev[m]>0){
    it.ids[m]=await createPlanRow(it.dept,baseFields(it,m,ano));
    ETAGS[tagKey(CFG.lists.plan,it.ids[m])]='"1"';
    // gestor gravado após a criação, do jeito confiável (Id de usuário); falha aqui não perde a linha
    try{await mergeItem(CFG.lists.plan,it.ids[m],{GESTORId:DB.me.uid});}catch(e){console.warn('GESTOR não gravado na linha',it.ids[m],e.message);}
  }
}
function setCell(it,m,v,keepPend){
  const shown=it.st[m]==='Aprovado'&&it.apr[m]!=null?it.apr[m]:it.prev[m];
  if(v===shown)return {changed:false};
  const old=it.prev[m];
  const s=old>0?it.st[m]:'Rascunho';
  it.prev[m]=v;
  let ev=null;
  if(s==='Aprovado'){it.st[m]=v>0?'Pendente':'Rascunho';it.apr[m]=null;delete it.mot[m];ev='re';}
  else if(s==='Pendente'){if(keepPend&&v>0){it.st[m]='Pendente';ev='kp';}else{it.st[m]='Rascunho';ev='ca';}it.apr[m]=null;delete it.mot[m];}
  else if(s==='Reprovado'&&keepPend&&v>0){it.st[m]='Pendente';ev='kp';it.apr[m]=null;delete it.mot[m];}
  else {it.st[m]='Rascunho';it.apr[m]=null;delete it.mot[m];}
  return {changed:true,ev};
}
function editCell(key,m,v,keepPend){
  if(recuperando||filaN>0){toast(recuperando?'Aguarde a atualização dos dados terminar.':'Aguarde a operação em andamento terminar.','warn');render();return;}
  const it=findItem(key);if(!it)return;
  const r=setCell(it,m,v,keepPend);
  if(!r.changed){rerenderKeepFocus();return;}
  if(r.ev==='re')toast(`${MES[m]} de “${it.det}” já estava aprovado. Voltou para aprovação.`,'warn');
  if(r.ev==='ca')toast(`Envio de ${MES[m]} de “${it.det}” cancelado. Reenvie quando terminar os ajustes.`);
  if(r.ev==='kp')toast(`Valor de ${MES[m]} de “${it.det}” ajustado — segue aguardando a diretoria.`);
  const ano=S.ano;
  busy(true);persistCell(it,m,ano).catch(fail).finally(()=>busy(false));
  rerenderKeepFocus();
}
function applyFill(val){
  if(escrevendo())return;
  if(!val){toast('Informe um valor maior que zero.','warn');return;}
  const it=findItem(S.tool.key);if(!it)return;
  const ano=S.ano;
  const ms=monthsOf(S.scope).filter(m=>mOpen(ano,m));
  if(!ms.length){toast('Todos os meses deste período estão encerrados.','warn');return;}
  let vals;
  if(S.tool.mode==='rep')vals=ms.map(()=>val);
  else{const base=Math.floor(val/ms.length*100)/100;vals=ms.map((_,k)=>k===ms.length-1?Math.round((val-base*(ms.length-1))*100)/100:base);}
  const tasks=[];let re=0;
  ms.forEach((m,k)=>{const r=setCell(it,m,vals[k]);if(r.changed){if(r.ev==='re')re++;tasks.push(()=>persistCell(it,m,ano));}});
  S.tool=null;render();
  runQueue(tasks,'Gravando').then(()=>{
    let msg=`“${it.det}” preenchido em ${ms.length} meses.`;

function pickCode(val,list,codeKey,descKey){
  val=String(val||'').trim();if(!val)return '';
  const low=val.toLowerCase();
  let hit=list.find(x=>(x[codeKey]+' - '+(x[descKey]||'')).toLowerCase()===low)
        ||list.find(x=>String(x[codeKey])===val)
        ||list.find(x=>String(x[codeKey])===((val.match(/^(\d+)/)||[])[1]||'__'));
  if(!hit){const m=list.filter(x=>(x[descKey]||'').toLowerCase().includes(low));if(m.length===1)hit=m[0];}
  return hit?hit[codeKey]:'';
}

function setMonthsStatus(key,fromSt){

  });

function sendScope(){
  if(escrevendo())return;
  if(DB.confState==='error'){toast('Não foi possível carregar as políticas do aplicativo (08_Config) — envio bloqueado por segurança. Clique em Atualizar ou avise a TI.','err');return;}
  const ms=monthsOf(S.scope);const tasks=[];let n=0;
  const bloqPrazo=confSN('BLOQUEAR_ENVIO_FORA_PRAZO');
  const limObs=confNum('OBS_OBRIGATORIA_ACIMA_DE',0);
  const hoje=new Date();
  const dentroPrazo=q=>{const p=DB.ex[S.ano]&&DB.ex[S.ano].prazos[q];return !bloqPrazo||!p||hoje<=new Date(p.slice(0,10)+'T23:59:59');};
  let foraPrazo=0;const semObs=[];
  itemsOf(S.ano,S.dept).forEach(i=>{
    const envi=ms.filter(m=>mOpen(S.ano,m)&&i.prev[m]>0&&i.st[m]==='Rascunho');
    if(!envi.length)return;
    const enviPrazo=envi.filter(m=>dentroPrazo(Math.floor(m/3)));   // o prazo decide ANTES: a observação só considera o valor realmente elegível
    foraPrazo+=envi.length-enviPrazo.length;
    if(!enviPrazo.length)return;
    if(limObs>0&&enviPrazo.reduce((a,m)=>a+i.prev[m],0)>limObs&&!(i.obs||'').trim()){semObs.push(i.det);return;}
    enviPrazo.forEach(m=>{
      i.st[m]='Pendente';n++;
      if(i.ids[m])tasks.push(()=>mergeItem(CFG.lists.plan,i.ids[m],{STATUS:'Pendente'}));
    });
  });
  if(!n){
    if(semObs.length){toast(`Envio bloqueado: ${semObs.slice(0,3).join(', ')}${semObs.length>3?'…':''} ${plural(semObs.length,'precisa','precisam')} de observação para a diretoria (itens acima de ${money(limObs)} — regra da tela Segurança).`,'warn');return;}
    if(foraPrazo){toast('Envio bloqueado: o prazo deste período já venceu (regra da tela Segurança). Peça uma reabertura ou ajuste o prazo em Exercícios e prazos.','warn');return;}
    toast('Nada em rascunho para enviar neste período.','warn');return;
  }
  render();
  runQueue(tasks,'Enviando').then(()=>{
    let msg=`${n} lançamento(s) de ${deptName(S.dept)} enviados para a diretoria.`;
    if(foraPrazo)msg+=` ${foraPrazo} mês(es) com prazo vencido ficaram de fora.`;
    if(semObs.length)msg+=` ${semObs.length} ${plural(semObs.length,'item ficou de fora por falta','itens ficaram de fora por falta')} de observação.`;
    toast(msg,(foraPrazo||semObs.length)?'warn':undefined);
  }).catch(fail);
}

const MESN=['JANEIRO','FEVEREIRO','MARCO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
function parseSheet(rows){
  let hi=-1;
  for(let i=0;i<rows.length;i++){const H=(rows[i]||[]).map(norm);if(H.includes('COD C.CUSTO')&&H.some(h=>h.startsWith('DETALHAMENTO'))){hi=i;break;}}
  if(hi<0)return null;
  const H=rows[hi].map(norm);
  const ccI=H.indexOf('COD C.CUSTO'),catI=H.indexOf('COD C.FINANCEIRA'),detI=H.findIndex(h=>h.startsWith('DETALHAMENTO')),cdI=H.indexOf('COD DETALHAMENTO'),catDI=H.indexOf('CATEGORIA FINANCEIRA'),ccDI=H.indexOf('CENTRO DE CUSTO');
  if(catI<0)return null;
  let mrow=null;for(let k=hi-1;k>=Math.max(0,hi-6);k--){const R=(rows[k]||[]).map(norm);if(R.includes('JANEIRO')){mrow=R;break;}}
  if(!mrow)return null;
  const mc=MESN.map(m=>mrow.indexOf(m));if(mc.some(c=>c<0))return null;
  const out=[];const ccD={};
  rows.slice(hi+1).forEach(r=>{
    r=r||[];const g=i=>i>=0&&i<r.length?r[i]:null;const blank=x=>x===null||x===undefined||x==='';
    const cc=g(ccI),cat=g(catI);
    if(ccI>0&&blank(cc)&&!blank(g(ccI-1))&&!blank(g(ccDI))){ccD[String(g(ccI-1)).replace(/\D/g,'').padStart(10,'0')]=String(g(ccDI)).trim();return;}
    if(blank(cc)||blank(cat))return;
    if(cdI>=0&&blank(g(cdI)))return;
    const catD=String((catDI>=0&&!blank(g(catDI))?g(catDI):'')||(ccDI>=0&&!blank(g(ccDI))?g(ccDI):'')).trim();
    const det=normDet(String(!blank(g(detI))?g(detI):(catD||'Item'))).slice(0,120);
    const vals=mc.map(c=>{const x=g(c);return typeof x==='number'&&isFinite(x)&&x>0?Math.round(x*100)/100:0;});
    if(!vals.some(v=>v>0))return;
    out.push({cc:String(cc).replace(/\D/g,'').padStart(10,'0'),cat:String(cat).replace(/\D/g,'').padStart(6,'0'),det,catD,vals});
  });
  return {items:out,ccD};
}
function readFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
      const sheets={};
      wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});const p=parseSheet(rows);if(p&&p.items.length)sheets[n]=p;});
      const names=Object.keys(sheets);
      if(!names.length)S.imp={error:'Nenhuma aba no formato do planejamento foi encontrada (faltam COD C.CUSTO, COD C.FINANCEIRA, DETALHAMENTO e os meses).'};
      else S.imp={file:file.name,sheets,sel:names.find(n=>!/TESTE/i.test(n))||names[0]};
    }catch(e){S.imp={error:'Não foi possível ler o arquivo. Confirme que é um Excel (.xlsx) válido.'};}
    render();
  };
  fr.readAsArrayBuffer(file);
}
function impPreview(){
  const p=S.imp.sheets[S.imp.sel];let dup=0,outro=0,inval=0,soFech=0,fechX=0;const novos=[];const compl=[];const seen=new Set();
  p.items.forEach(r=>{
    // o cadastro do ERP decide: CC existe? categoria existe? o CC é deste departamento?
    const cad=DB.ccs.find(c=>c.COD_CC===r.cc);
    if(!cad||!DB.cats.some(c=>c.COD_CAT===r.cat)){inval++;return;}
    if(cad.COD_DPTO!==S.dept){outro++;return;}
    const k=(r.cc+'|'+r.cat+'|'+r.det).toLowerCase();
    if(seen.has(k)){dup++;return;}
    seen.add(k);
    const ja=findPlanItem(S.ano,S.dept,r.cc,r.cat,r.det);
    if(ja){if(mesesFaltantes(ja,r.vals,S.ano).length)compl.push(r);else dup++;return;}
    if(!r.vals.some((v,m)=>v>0&&mOpen(S.ano,m))){soFech++;fechX+=r.vals.reduce((b,v)=>b+(v>0?v:0),0);return;}
    novos.push(r);
  });
  const totalCompl=compl.reduce((a,r)=>{const it=findPlanItem(S.ano,S.dept,r.cc,r.cat,r.det);return a+mesesFaltantes(it,r.vals,S.ano).reduce((b,m)=>b+r.vals[m],0);},0);
  return {found:p.items.length,dup,outro,inval,novos,compl,soFech,
    total:novos.reduce((a,r)=>a+r.vals.reduce((b,v,m)=>b+(mOpen(S.ano,m)?v:0),0),0)+totalCompl,
    fech:fechX+novos.concat(compl).reduce((a,r)=>a+r.vals.reduce((b,v,m)=>b+(!mOpen(S.ano,m)&&v>0?v:0),0),0)};
}

  document.getElementById('mBody').innerHTML=(rows.length
    ?`<table class="simple"><thead><tr><th>Compet\u00eancia</th><th>Tipo</th><th>Documento</th><th>NF</th><th>Fornecedor</th><th style="text-align:right">Valor</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtD(String(r.data||''))}</td><td class="code">${esc(r.tipo||'')}</td><td class="code">${esc(r.doc||'')}</td><td class="code">${esc(r.nf||'')}</td><td>${esc(r.forn||'')}${r.obs?`<span class="detline">${esc(r.obs)}</span>`:''}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${moneyC(Number(r.valor)||0)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5" style="text-align:right;font-weight:600;padding:10px 8px">Total \u00b7 ${rows.length} lan\u00e7amento(s)</td><td style="text-align:right;font-weight:700;padding:10px 8px">${moneyC(tot)}</td></tr></tfoot></table>`
    :'<p class="empty">Nenhum lan\u00e7amento.</p>')+revLine;

/* ============================== APROVAÇÃO ============================= */
function pendInfo(d){
  let v=0,c=0;itemsOf(S.aAno,d).forEach(i=>{let any=false;i.st.forEach((s,m)=>{if(s==='Pendente'&&i.prev[m]>0&&mAprovavel(S.aAno,m,d)){v+=i.prev[m];any=true;}});if(any)c++;});
  return {v,c};
}
function aRows(){
  const ms=monthsOf(S.aScope);
  return itemsOf(S.aAno,S.aDept).map(i=>{const pm=ms.filter(m=>i.st[m]==='Pendente'&&i.prev[m]>0&&mAprovavel(S.aAno,m,S.aDept));return pm.length?{i,pm,prev:pm.reduce((a,m)=>a+i.prev[m],0)}:null;}).filter(Boolean);
}
const dKey=r=>`${S.aAno}|${S.aDept}|${S.aScope}|${r.i.key}`;
function dOf(r){const k=dKey(r);if(!S.dec[k])S.dec[k]={d:null,val:r.prev,mot:'',mode:'lote',months:null};return S.dec[k];}
const decidedMonths=(x,d)=>d.mode==='mes'?x.pm.filter(m=>d.months&&d.months[m]&&d.months[m].d):(d.d?x.pm.slice():[]);
const monthDec=(d,m)=>d.mode==='mes'?d.months[m].d:d.d;
function loteVals(x,d){const f=x.prev?d.val/x.prev:0;const out={};let acc=0;x.pm.forEach((m,i)=>{let v=i===x.pm.length-1?Math.round((d.val-acc)*100)/100:Math.round(x.i.prev[m]*f*100)/100;if(v<0)v=0;out[m]=v;acc+=v;});return out;}
const monthOkVal=(x,d,m)=>d.mode==='mes'?d.months[m].val:loteVals(x,d)[m];
function needMotNow(x,d){return decidedMonths(x,d).some(m=>{const dec=monthDec(d,m);return dec==='no'||(dec==='ok'&&Math.abs(monthOkVal(x,d,m)-x.i.prev[m])>0.005);});}

function renderAprov(){
  setHead('Aprovação orçamentária','');
  if(!ANOS().length){document.getElementById('view').innerHTML=noExPanel();return;}
  const PD=planDepts(S.aAno);
  if(!S.aDept||!PD.includes(S.aDept)){const f=PD.find(d=>pendInfo(d).c>0);S.aDept=f||PD[0];}
  const closed=exStatus(S.aAno)==='Encerrado'&&!anyReab(S.aAno,S.aDept);
  const rows=aRows();
  let left=`<div class="dlist"><div class="row">${yearSeg(S.aAno,'data-aano')}</div><div class="hint">Departamentos</div>`;
  PD.forEach(d=>{
    const p=pendInfo(d);const late=[0,1,2,3].filter(q=>prazoStatus(d,S.aAno,q).s==='Atrasado');
    const gest=[...new Set(DB.vincs.filter(v=>v.cod===d).map(v=>v.nome))];
    left+=`<button class="dbtn" data-adept="${d}" aria-pressed="${S.aDept===d}"><b>${esc(deptName(d))}</b><span class="sub">${p.c?`${p.c} item(ns) aguardando · ${money(p.v)}`:'Nada aguardando'}</span>${late.length?`<span class="sub unpl">Envio atrasado: ${late.map(q=>QLAB[q]).join(', ')}</span>`:''}${gest.length?`<span class="sub">${gest.map(esc).join(', ')}</span>`:''}</button>`;
  });
  left+=`</div>`;

  let r=`<div class="panel"><div class="toolbar"><div class="seg" role="group" aria-label="Período em análise">${['ANO',0,1,2,3].map(sc=>`<button data-ascope="${sc}" aria-pressed="${S.aScope===sc}">${sc==='ANO'?'Ano':QLAB[sc]}</button>`).join('')}</div><span class="meta">${closed?'Exercício encerrado — somente consulta':''}</span></div>`;
  r+=`<div class="stats" id="aKpi"></div>`;
  if(!rows.length){r+=`<p class="empty">Nada aguardando aprovação neste período para ${esc(deptName(S.aDept))} em ${S.aAno}.</p>`;}
  else{
    r+=`<div class="gridwrap"><table class="ap"><thead><tr><th>Item</th><th class="num">Previsto</th><th class="num">Aprovado</th><th>Decisão</th><th>Justificativa</th></tr></thead><tbody>`;
    rows.forEach(x=>{
      const d=dOf(x);const k=dKey(x);const mes=d.mode==='mes';const need=!mes&&needMotNow(x,d);
      const rateio=!mes&&d.d==='ok'&&d.val!==x.prev?(()=>{const lv=loteVals(x,d);return `<span class="sub">Rateio: ${x.pm.map(m=>MES[m]+' '+fmt(lv[m])).join(' · ')}</span>`;})():'';
      r+=`<tr><td><b>${esc(x.i.det)}</b><span class="sub"><span class="code">${x.i.cc}</span> · <span class="code">${x.i.cat}</span></span><span class="sub">${x.pm.map(m=>MES[m]).join(', ')}</span>${x.i.obs?`<span class="obs">“${esc(x.i.obs)}”</span>`:''}</td>
        <td class="num">${money(x.prev)}</td>
        <td class="num">${mes?'<span class="muted">—</span>':`<input class="aval" data-key="a-${esc(x.i.key)}" data-k="${esc(k)}" inputmode="decimal" value="${fmt(d.val)}" ${(closed||d.d==='no')?'disabled':''} aria-label="Valor aprovado de ${esc(x.i.det)}">`}</td>
        <td>${mes?'':`<div class="dec"><button class="yes" data-k="${esc(k)}" data-d="ok" aria-pressed="${d.d==='ok'}" ${closed?'disabled':''}>✓ Aprovar</button><button class="no" data-k="${esc(k)}" data-d="no" aria-pressed="${d.d==='no'}" ${closed?'disabled':''}>✗ Reprovar</button></div>`}<button class="lnk" data-mode-k="${esc(k)}" ${closed?'disabled':''} style="margin-top:6px">${mes?'Voltar à decisão única':'Decidir mês a mês'}</button></td>
        <td>${mes?'<span class="muted">—</span>':(need?`<input class="amot ${d.mot?'':'req'}" data-k="${esc(k)}" placeholder="${d.d==='no'?'Motivo da reprovação':'Motivo do ajuste de '+money(Math.abs(x.prev-d.val))}" value="${esc(d.mot)}" ${closed?'disabled':''} aria-label="Justificativa">`:'<span class="muted">—</span>')}${rateio}</td></tr>`;
      if(mes){
        r+=`<tr class="mesrow"><td colspan="5"><div class="mgrid">${x.pm.map(m=>{const md=d.months[m];return `<div class="mcell ${md.d==='ok'?'ok':md.d==='no'?'no':''}"><b>${MES[m]}</b><span class="sub">Previsto ${fmt(x.i.prev[m])}</span><input data-key="mv-${esc(k)}-${m}" data-mvk="${esc(k)}|${m}" inputmode="decimal" value="${fmt(md.val)}" ${(closed||md.d==='no')?'disabled':''} aria-label="Valor aprovado de ${MES[m]}"><div class="dec"><button class="yes" data-mk="${esc(k)}|${m}" data-md="ok" aria-pressed="${md.d==='ok'}" ${closed?'disabled':''}>✓</button><button class="no" data-mk="${esc(k)}|${m}" data-md="no" aria-pressed="${md.d==='no'}" ${closed?'disabled':''}>✗</button></div>${(md.d==='no'||(md.d==='ok'&&Math.abs(md.val-x.i.prev[m])>0.005))?`<input class="mmot ${(md.mot||'').trim()?'':'req'}" data-mmk="${esc(k)}|${m}" placeholder="${md.d==='no'?'Motivo da reprovação':'Motivo do ajuste'}" value="${esc(md.mot||'')}" ${closed?'disabled':''} aria-label="Justificativa de ${MES[m]}">`:''}</div>`;}).join('')}</div></td></tr>`;
      }
    });
    r+=`</tbody></table></div><div class="afoot"><span class="hint" id="aStatus"></span><button class="btn" id="confirmBtn" ${closed?'disabled':''}>Confirmar decisões</button></div>`;
  }
  r+=`</div>`;
  const v=document.getElementById('view');
  v.innerHTML=`<div class="split"><div class="panel">${left}</div>${r}</div>`;
  updateAprovFooter();
  v.querySelectorAll('[data-aano]').forEach(b=>b.onclick=async()=>{if(Number(b.dataset.aano)===S.aAno)return;descartaDec();S.aAno=Number(b.dataset.aano);S.aDept=null;try{await loadYear(S.aAno);}catch(e){fail(e);}render();});
  v.querySelectorAll('[data-adept]').forEach(b=>b.onclick=()=>{if(b.dataset.adept===S.aDept)return;descartaDec();S.aDept=b.dataset.adept;render();});
  v.querySelectorAll('[data-ascope]').forEach(b=>b.onclick=()=>{const x=b.dataset.ascope;const nv=x==='ANO'?'ANO':Number(x);if(nv===S.aScope)return;descartaDec();S.aScope=nv;render();});
  v.querySelectorAll('.dec button[data-k]').forEach(b=>b.onclick=()=>{const d=S.dec[b.dataset.k];d.d=d.d===b.dataset.d?null:b.dataset.d;render();});
  v.querySelectorAll('[data-mode-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.modeK;const d=S.dec[k];const x=aRows().find(r=>dKey(r)===k);if(!d||!x)return;
    if(d.mode==='mes')d.mode='lote';
    else{d.mode='mes';d.d=null;d.months=d.months||{};x.pm.forEach(m=>{if(!d.months[m])d.months[m]={d:null,val:x.i.prev[m],mot:''};});}
    render();
  });
  v.querySelectorAll('.dec button[data-mk]').forEach(b=>b.onclick=()=>{
    const s2=b.dataset.mk,i2=s2.lastIndexOf('|'),k=s2.slice(0,i2),m=+s2.slice(i2+1);
    const md=S.dec[k].months[m];md.d=md.d===b.dataset.md?null:b.dataset.md;render();
  });
  v.querySelectorAll('input[data-mvk]').forEach(inp=>{
    inp.onfocus=()=>inp.select();
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
    inp.onchange=()=>{
      const s2=inp.dataset.mvk,i2=s2.lastIndexOf('|'),k=s2.slice(0,i2),m=+s2.slice(i2+1);
      const x=aRows().find(r=>dKey(r)===k);const md=S.dec[k].months[m];
      md.val=parse(inp.value);if(!md.d)md.d='ok';rerenderKeepFocus();
    };
  });
  v.querySelectorAll('input.aval[data-k]').forEach(inp=>{
    inp.onfocus=()=>inp.select();
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
    inp.onchange=()=>{const x=aRows().find(r=>dKey(r)===inp.dataset.k);const d=S.dec[inp.dataset.k];d.val=parse(inp.value);if(!d.d)d.d='ok';rerenderKeepFocus();};
  });
  v.querySelectorAll('input.amot').forEach(inp=>{inp.oninput=()=>{S.dec[inp.dataset.k].mot=inp.value;inp.classList.toggle('req',!inp.value.trim());updateAprovFooter();};});
  v.querySelectorAll('input[data-mmk]').forEach(inp=>{inp.oninput=()=>{
    const s2=inp.dataset.mmk,i2=s2.lastIndexOf('|'),k=s2.slice(0,i2),m=+s2.slice(i2+1);
    S.dec[k].months[m].mot=inp.value;inp.classList.toggle('req',!inp.value.trim());updateAprovFooter();
  };});
  const cb=document.getElementById('confirmBtn');if(cb)cb.onclick=confirmAprov;
}
function updateAprovFooter(){
  const rows=aRows();let prev=0,decPrev=0,apr=0,bad=0,zero=0,decM=0;
  const totM=rows.reduce((a,x)=>a+x.pm.length,0);
  rows.forEach(x=>{const d=dOf(x);prev+=x.prev;
    const dm=decidedMonths(x,d);
    decM+=dm.length;
    if(dm.length){
      dm.forEach(m=>{decPrev+=x.i.prev[m];if(monthDec(d,m)==='ok'){const v=monthOkVal(x,d,m);if(!(v>0))zero++;else apr+=v;}});
      if(d.mode==='mes'){
        if(dm.some(m=>{const md=d.months[m];const nm=md.d==='no'||(md.d==='ok'&&Math.abs(md.val-x.i.prev[m])>0.005);return nm&&!(md.mot||'').trim();}))bad++;
      }else if(needMotNow(x,d)&&!d.mot.trim())bad++;
    }});
  const cut=(decPrev-apr)||0;const k=document.getElementById('aKpi');
  if(k)k.innerHTML=`<div class="stat"><span>Em análise</span><b>${money(prev)}</b></div><div class="stat"><span>Aprovado</span><b>${money(apr)}</b></div><div class="stat"><span>Diferença p/ pedido</span><b>${money(cut?-cut:0)}</b></div><div class="stat"><span>Ajuste sobre o decidido</span><b>${decPrev?Math.round(-cut/decPrev*100):0}%</b></div>`;
  const s=document.getElementById('aStatus'),b=document.getElementById('confirmBtn');if(!s||!b)return;
  s.textContent=zero?`Aprovar exige valor maior que zero — use Reprovar para zerar (${zero} mês(es) com R$ 0).`:bad?`Falta justificativa em ${bad} item(ns).`:`${decM} de ${totM} meses decididos. Os demais continuam aguardando.`;
  b.disabled=(exStatus(S.aAno)==='Encerrado'&&!anyReab(S.aAno,S.aDept))||!decM||bad>0||zero>0;
}
function confirmAprov(){
  if(escrevendo())return;
  const tasks=[];let okM=0,noM=0;const nowIso=new Date().toISOString();
  aRows().forEach(x=>{
    const d=S.dec[dKey(x)];if(!d)return;
    const dm=decidedMonths(x,d);if(!dm.length)return;
    dm.forEach(m=>{
      const mot=(d.mode==='mes'?(d.months[m].mot||''):d.mot).trim();
      if(monthDec(d,m)==='ok'){
        const val=Math.round(monthOkVal(x,d,m)*100)/100;
        x.i.apr[m]=val;x.i.st[m]='Aprovado';const dif=Math.abs(val-x.i.prev[m])>0.005;if(mot&&dif)x.i.mot[m]=mot;
        if(x.i.ids[m])tasks.push(()=>mergeItem(CFG.lists.plan,x.i.ids[m],{STATUS:'Aprovado',APROVADO:val,MOTIVO:(dif?mot:''),DATA_APROVACAO:nowIso,APROVADO_PORId:DB.me.uid}));
        okM++;
      }else{
        x.i.apr[m]=0;x.i.st[m]='Reprovado';x.i.mot[m]=mot;
        if(x.i.ids[m])tasks.push(()=>mergeItem(CFG.lists.plan,x.i.ids[m],{STATUS:'Reprovado',APROVADO:0,MOTIVO:mot,DATA_APROVACAO:nowIso,APROVADO_PORId:DB.me.uid}));
        noM++;
      }
    });
    delete S.dec[dKey(x)];
  });
  render();
  runQueue(tasks,'Gravando decisões').then(()=>toast(`${okM} mês(es) aprovado(s) e ${noM} reprovado(s).`)).catch(fail);
}

async function addVinc(){
  if(escrevendo())return;
  const cod=document.getElementById('gDept').value;
  const email=document.getElementById('gEmail').value.trim().toLowerCase();
  if(!email||!email.includes('@')){toast('Informe o e-mail do gestor.','warn');return;}
  if(DB.vincs.some(v=>v.cod===cod&&v.email===email)){toast('Este gestor já está vinculado a '+deptName(cod)+'.','warn');return;}
  const off=(DB.vincsOff||[]).find(v=>v.cod===cod&&v.email===email);
  if(off){
    busy(true);
    try{
      await mergeItem(CFG.lists.vinc,off.Id,{ATIVO:true});
      DB.vincsOff=DB.vincsOff.filter(v=>v.Id!==off.Id);DB.vincs.push(off);
      render();
      toast(`Vínculo de ${off.nome} com ${deptName(cod)} reativado. Confira a Edição dele na pasta ${cod}.`,'warn');
    }catch(e){fail(e);}finally{busy(false);}
    return;
  }
  busy(true);
  try{
    const uid=await ensureUser(email);
    const dept=DB.deptByCod[cod];
    const j=await addItem(CFG.lists.vinc,{Title:`${email} · ${cod}`,GESTORId:uid,DEPARTAMENTOId:dept.Id,ATIVO:true});
    DB.vincs.push({Id:j.Id,cod,email,nome:email.split('@')[0]});
    render();
    toast(`Gestor vinculado a ${deptName(cod)}. Agora conceda Edição na pasta ${cod} da lista ${CFG.lists.plan} para ele.`,'warn');
  }catch(e){fail(e);}finally{busy(false);}
}
async function rmVinc(id){
  if(escrevendo())return;
  const v=DB.vincs.find(x=>x.Id===id);if(!v)return;
  busy(true);
  try{
    await mergeItem(CFG.lists.vinc,id,{ATIVO:false});
    DB.vincs=DB.vincs.filter(x=>x.Id!==id);DB.vincsOff.push(v);
    render();
    toast(`Vínculo removido. Lembre-se de retirar o acesso dele à pasta ${v.cod} no SharePoint.`,'warn');
  }catch(e){fail(e);}finally{busy(false);}
}

/* diagnóstico somente leitura: core, biblioteca local, listas, Realizado,
   unicidade das chaves e estado das políticas */
async function diagAmbiente(){
  const out=[];const ok=(n,d)=>out.push([n,true,d||'']);const bad=(n,d)=>out.push([n,false,d||'']);
  ok('Aplicativo','Planejamento Orçamentário v'+APP_VERSION+' · build '+APP_BUILD);
  if(window.PS&&PS.sprest&&PS.mount&&PS.auth)ok('Core compartilhado','/core/polystell.js carregado (auth · sprest · shell)');else bad('Core compartilhado','PS incompleto — confira /core/polystell.js');
  if(typeof XLSX==='object'&&XLSX.utils)ok('Biblioteca XLSX local','0.18.5 em /core/vendor/');else bad('Biblioteca XLSX local','não carregou — importar/exportar planilha indisponível');
  ok('Usuário autenticado',DB.me.email+' · '+roleLabel(myDepts()));
  const listas=[CFG.lists.plan,CFG.lists.vinc,CFG.lists.ex,CFG.lists.dept,CFG.lists.cc,CFG.lists.cat,CFG.lists.perfil,CFG.lists.reab,CFG.lists.config,CFG.lists.log];
  for(const lista of listas){
    try{await getAll(lista,'$select=Id&$top=1');ok('Lista '+lista);}
    catch(e){bad('Lista '+lista,e&&e.status?'HTTP '+e.status+(e.status===404?' — não existe ou sem acesso':''):String((e&&e.message)||e).split('\n')[0]);}
  }
  try{const f=await sp(`web/GetFolderByServerRelativePath(decodedurl='${CFG.sitePath}/${CFG.realLib}')?$select=Exists`);
    (f&&f.Exists)?ok('Biblioteca '+CFG.realLib):bad('Biblioteca '+CFG.realLib,'não encontrada');}
  catch(e){bad('Biblioteca '+CFG.realLib,e&&e.status?'HTTP '+e.status:'');}
  const unica=async(lista,col)=>{
    try{const j=await sp(`web/lists/getbytitle('${encodeURIComponent(lista)}')/fields?$filter=InternalName eq '${col}'&$select=Required,EnforceUniqueValues,Indexed`);
      const f=j&&j.value&&j.value[0];
      if(!f)return bad(col+' em '+lista,'coluna não encontrada');
      if(f.Required&&f.EnforceUniqueValues)ok(col+' em '+lista,'obrigatória · exclusiva'+(f.Indexed?' · indexada':''));
      else bad(col+' em '+lista,`Obrigatória=${f.Required?'Sim':'Não'} · Exclusiva=${f.EnforceUniqueValues?'Sim':'Não'} — configure na coluna`);}
    catch(e){bad(col+' em '+lista,e&&e.status?'HTTP '+e.status:'');}
  };
  await unica(CFG.lists.plan,'CHAVE_ITEM');
  await unica(CFG.lists.config,'CHAVE');
  out.push(['Políticas (08_Config)',DB.confState==='ok',DB.confState==='ok'?((DB.conf||[]).length+' parâmetro(s) gravado(s); ausentes usam o padrão'):'não carregadas — envio e exclusão bloqueados']);
  return out;
}

/* --- aba Parâmetros (08_Config) --- */
function segPar(){
  const box=document.getElementById('segBody');
  let h='';
  if(DB.conf===null){
    h+=`<p class="empty warnline">⚠ Não foi possível carregar a 08_Config — por segurança, envio para aprovação e exclusão ficam bloqueados até recarregar (clique em Atualizar ou avise a TI).<br>Se a lista ainda não existe: crie “08_Config” com as colunas <b>CHAVE</b> (uma linha de texto, obrigatória e com valores exclusivos) e <b>VALOR</b> (uma linha de texto), com <b>Leitura</b> para todos os usuários do app e <b>Edição</b> para a TI.</p>`;
  }
  h+=`<div class="gridwrap"><table class="simple"><thead><tr><th>Parâmetro</th><th style="width:140px">Valor</th><th style="width:110px">Situação</th></tr></thead><tbody>`;
  PARAMS.forEach(p=>{
    const raw=confRaw(p.k);
    const val=raw==null?p.padrao:raw;
    const sim=/^s/i.test(val);
    const ctl=p.tipo==='sn'
      ?`<select data-ck="${p.k}" ${DB.conf===null?'disabled':''} aria-label="${esc(p.nome)}"><option ${sim?'':'selected'}>Não</option><option ${sim?'selected':''}>Sim</option></select>`
      :`<input type="text" inputmode="numeric" data-ck="${p.k}" value="${esc(val)}" style="width:110px;text-align:right" ${DB.conf===null?'disabled':''} aria-label="${esc(p.nome)}">`;
    h+=`<tr><td><b>${esc(p.nome)}</b><span class="detline">${esc(p.desc)}</span><span class="sub code">${p.k}</span></td><td>${ctl}</td><td><span class="chip c-${raw!=null?'ok':'draft'}">${raw!=null?'Gravado':'Padrão'}</span></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<p class="hint">Os padrões reproduzem o comportamento original do aplicativo — nada muda até alterar um valor aqui. A alteração grava na hora e vale para todos na próxima atualização de tela.</p>`;
  box.innerHTML=h;
  box.querySelectorAll('[data-ck]').forEach(el=>{
    el.onchange=async()=>{
      if(escrevendo()){render();return;}
      const k=el.dataset.ck;const def=PARAMS.find(x=>x.k===k);
      let nv=String(el.value).trim();
      if(def.tipo==='num'){const nx=Number(nv.replace(/\./g,'').replace(',','.'));
        const ok=isFinite(nx)&&nx>=(def.min!=null?def.min:0)&&(def.max==null||nx<=def.max)&&(!def.inteiro||nx%1===0);
        if(!ok){toast(def.max!=null?`Informe um número inteiro entre ${def.min} e ${def.max}.`:'Informe um número válido (0 desliga).','warn');render();return;}
        nv=String(nx);}
      const r=(DB.conf||[]).find(x=>String(x.CHAVE||'').trim().toUpperCase()===k);
      busy(true);
      try{
        if(r){await mergeItem(CFG.lists.config,r.Id,{VALOR:nv});r.VALOR=nv;toast('Parâmetro atualizado.');}
        else{const j=await addItem(CFG.lists.config,{Title:k,CHAVE:k,VALOR:nv});DB.conf.push({Id:j.Id,CHAVE:k,VALOR:nv});toast('Parâmetro gravado na 08_Config.');}
      }catch(e){fail(e);}finally{busy(false);render();}
    };
  });
}
