<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portaria · Controle de Acesso | Polystell</title>
<style>
:root{--side:#0D1A41;--primary:#2141A2;--primary-h:#1a3484;--bg:#E8E9EE;--card:#fff;--ink:#1c2740;--muted:#67718a;--line:#dde1ea;--ok:#1e7d5f;--warn:#9a6a1f;--err:#b23c2e;--r:14px;--font:"Open Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[hidden]{display:none!important}
a{color:var(--primary)}
::placeholder{color:#99a1b5}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #7b97e8;outline-offset:1px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:#4a5571;margin:0 0 6px}
.field{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.btn:hover{background:#f4f6fa}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:#e4c2bc}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eef1f7;color:#55607c;white-space:nowrap}
.chip.ok{background:#e3f2ec;color:var(--ok)}
.chip.warn{background:#f8efdc;color:var(--warn)}
.chip.err{background:#f9e7e4;color:var(--err)}
.chip.blue{background:#e7ecfa;color:var(--primary)}
/* ---- shell ---- */
.app{display:flex;min-height:100vh;gap:0}
.side{position:fixed;left:14px;top:14px;bottom:14px;width:232px;background:var(--side);border-radius:18px;color:#dfe6f5;display:flex;flex-direction:column;padding:22px 14px 16px;z-index:40;box-shadow:0 10px 30px #0d1a4126}
.side .logo{display:flex;justify-content:center;padding:2px 6px 18px;border-bottom:1px solid #ffffff14}
.side .logo img{max-width:150px;max-height:44px;object-fit:contain}
.side .logo .fb{font-weight:700;font-size:22px;letter-spacing:-.8px;color:#fff}
.nav{flex:1;overflow-y:auto;padding-top:16px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:#b9c4dd;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600}
.nav button:hover{background:#ffffff0e;color:#fff}
.nav button.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px #2141a23d}
.nav .cnt{margin-left:auto;font-size:11px;background:#ffffff1a;border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.side .foot{border-top:1px solid #ffffff14;padding-top:12px;font-size:11px;color:#9eabc9;display:flex;flex-direction:column;gap:8px}
.porteiro{display:flex;align-items:center;gap:8px;background:#ffffff0d;border:1px solid #ffffff17;border-radius:10px;padding:8px 10px}
.porteiro b{color:#fff;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.porteiro button{margin-left:auto;border:0;background:none;color:#aebadb;padding:2px}
.main{flex:1;margin-left:260px;padding:22px 26px 30px;max-width:1340px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;letter-spacing:-.4px}
.top .clock{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.top .clock b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--r);padding:15px 17px;border:1px solid #fff;box-shadow:0 4px 14px #1c274008}
.kpi b{font-size:24px;letter-spacing:-.5px}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.panel{background:var(--card);border-radius:var(--r);padding:19px 20px;box-shadow:0 4px 14px #1c274008;margin-bottom:16px}
.panel>h2{font-size:15px;margin:0 0 13px;display:flex;align-items:center;gap:8px}
.panel>h2 .chip{margin-left:auto}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #eef0f5}
.item:first-child{border-top:0}
.item .t{font-weight:700;font-size:13px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.item .act{margin-left:auto;display:flex;gap:7px;align-items:center;flex-shrink:0}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:#55607c}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pick{position:relative}
.pick .menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px #1c274024;z-index:30;max-height:240px;overflow:auto}
.pick .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font-size:13px}
.pick .menu button:hover{background:#f1f4fa}
.pick .menu .meta{font-size:11px;color:var(--muted)}
.selbox{display:flex;align-items:center;gap:9px;background:#eef2fb;border:1px solid #ccd8f2;border-radius:9px;padding:9px 12px;font-size:13px}
.selbox b{flex:1}
.selbox button{border:0;background:none;color:var(--primary);font-weight:700}
.note{font-size:12px;color:var(--muted);background:#f4f6fa;border-radius:9px;padding:9px 12px;line-height:1.6;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:#15223f;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:min(560px,90vw);box-shadow:0 10px 30px #0d1a4140}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#7c2b20}
dialog{border:0;border-radius:16px;padding:0;max-width:480px;width:calc(100% - 40px);box-shadow:0 26px 70px #0d1a4150}
dialog::backdrop{background:#0d1a4155;backdrop-filter:blur(2px)}
.dlg{padding:24px}
.dlg h3{margin:0 0 7px;font-size:17px}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.7}
.dlg .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gcard{background:#fff;border-radius:20px;box-shadow:0 18px 50px #0d1a4121;max-width:400px;width:100%;padding:38px 36px;text-align:center}
.gcard img{max-width:170px;margin-bottom:8px}
.gcard h1{font-size:21px;margin:10px 0 8px;letter-spacing:-.4px}
.gcard p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 20px}
.spin{width:30px;height:30px;border:3px solid #d9def0;border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag-ent{color:var(--ok);font-weight:700}
.modalseg{display:flex;gap:8px;flex-wrap:wrap}
.modalseg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;color:#55607c;display:flex;gap:7px;align-items:center}
.modalseg button.on{background:#e7ecfa;border-color:var(--primary);color:var(--primary)}
@media(max-width:1060px){.cols{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
@media(max-width:820px){.side{position:static;width:auto;margin:10px;flex-direction:row;align-items:center;padding:10px 12px;border-radius:14px}.side .logo{border:0;padding:0 10px 0 0}.side .logo img{max-height:30px}.nav{flex-direction:row;padding:0;overflow-x:auto}.nav .cnt{display:none}.side .foot{display:none}.main{margin-left:0;padding:8px 14px 24px}.app{display:block}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="gcard">
 <img src="../logo-polystell.png" alt="Polystell" onerror="this.hidden=true">
 <h1>Portaria · Controle de Acesso</h1>
 <p id="gmsg">Entre com a conta corporativa para abrir o posto da portaria.</p>
 <div id="gspin" class="spin" hidden></div>
 <button id="gbtn" class="btn primary" style="width:100%">Entrar com Microsoft</button>
 <p style="margin-top:16px;font-size:11px">Acesso registrado. Uso exclusivo da portaria e áreas autorizadas.</p>
</div></div>

<div id="app" class="app" hidden>
 <aside class="side">
  <div class="logo"><img src="../logo-polystell.png" alt="Polystell" onerror="this.outerHTML='&lt;span class=fb&gt;polystell.&lt;/span&gt;'"></div>
  <nav class="nav" id="nav"></nav>
  <div class="foot">
   <div class="porteiro" id="pbox"><span>👤</span><b id="pnome">—</b><button id="ptrocar" title="Trocar porteiro">✎</button></div>
   <span id="uinfo">Conectado</span>
  </div>
 </aside>
 <main class="main">
  <div class="top"><h1 id="vtitle">Início</h1><div class="clock"><b id="chora">--:--</b><span id="cdata"></span></div></div>
  <div id="view"></div>
 </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* Portaria · Controle de Acesso — Fase 1.
   Gate PC: pessoas, veículos, mercadorias, ocorrências, agenda do dia.
   Sem segredos no HTML. A visibilidade de botões é usabilidade; a
   autorização real está nas permissões das listas do SharePoint. */
const CONFIG=Object.freeze({
 clientId:'c066630d-9dc2-4c4a-8c60-8f0056e9e5e2',
 tenantId:'fdb7cb21-cc9d-4f32-bb70-e71cad1eb164',
 siteHost:'polystellcombr.sharepoint.com', sitePath:'/sites/Apps',
 scopes:['Sites.ReadWrite.All','User.Read'],
 msalUrl:'https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js',
 listas:{movP:'09_Mov_Pessoas',agend:'09_Agendamentos',prevV:'09_Prev_Veiculos',movV:'09_Mov_Veiculos',merc:'09_Mercadorias',ocor:'09_Ocorrencias',colab:'00_Cadastro_Colaborador',params:'00_Parametros_Apps'}
});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hhmm=d=>d?new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—';
const dsh=d=>d?new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const maskDoc=v=>{const d=String(v||'').replace(/\D/g,'');if(d.length>=9)return d.slice(0,3).replace(/\d/g,'*')+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9).replace(/\d/g,'*').padEnd(Math.max(0,d.length-9),'*');return d.length>4?'*'.repeat(d.length-4)+d.slice(-4):v;};
let msalApp=null,account=null,SITE=null,LISTS={},PARAMS={},COLABS=null,SITEUSERS=null,view='inicio',toastT=null;
const S={pessoas:{tipo:'Colaborador',colab:null,modal:null,anf:null},merc:{dest:null},veic:{}};
const D={dentro:[],agenda:[],prev:[],patio:[],merc:[],ocor:[]};
function toast(m,err){const t=$('#toast');clearTimeout(toastT);t.textContent=m;t.className='toast show'+(err?' err':'');toastT=setTimeout(()=>t.classList.remove('show'),3800);}
function dlg(html){$('#dlgc').innerHTML=html;if(!$('#dlg').open)$('#dlg').showModal();}
function dclose(){$('#dlg').close();}
/* ---------- Graph ---------- */
async function token(){const r=await msalApp.acquireTokenSilent({scopes:CONFIG.scopes,account});return r.accessToken;}
async function graph(path,opt={}){
 const url=new URL(path.startsWith('https://')?path:'https://graph.microsoft.com/v1.0'+path);
 if(url.origin!=='https://graph.microsoft.com')throw new Error('Destino não autorizado');
 const t=await token();
 for(let a=0;a<3;a++){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);let r;
  try{r=await fetch(url,{method:opt.method||'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined,signal:ctl.signal});}finally{clearTimeout(tm);}
  if([429,503,504].includes(r.status)&&a<2){const ra=Number(r.headers.get('Retry-After'))||a+1;await new Promise(x=>setTimeout(x,Math.min(ra,6)*1000));continue;}
  if(r.status===204)return null;
  if(!r.ok){let d='';try{d=(await r.json())?.error?.message||'';}catch{}throw Object.assign(new Error('Graph '+r.status+(d?' — '+d:'')),{status:r.status});}
  return r.json();
 }
 throw new Error('Falha ao consultar o Microsoft Graph.');
}
async function boot(){
 SITE=(await graph('/sites/'+CONFIG.siteHost+':'+CONFIG.sitePath)).id;
 const ls=await graph('/sites/'+SITE+'/lists?$select=id,name,displayName,system&$top=200');
 const byName={};(ls.value||[]).forEach(l=>{byName[l.displayName]=l.id;if(l.name==='users'||/user information|informações de usu/i.test(l.displayName||''))LISTS._users=l.id;});
 for(const[k,n]of Object.entries(CONFIG.listas)){LISTS[k]=byName[n];if(!LISTS[k])throw new Error('Lista não encontrada: '+n);}
 await loadParams();
}
async function items(listId,q){let out=[],next='/sites/'+SITE+'/lists/'+listId+'/items?'+q;
 while(next){const p=await graph(next,{headers:{Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'}});out.push(...(p.value||[]));next=p['@odata.nextLink']||null;if(out.length>1200)break;}
 return out;}
const F=it=>({id:it.id,...(it.fields||{})});
const V=x=>x?.Value??x;
async function addItem(listKey,fields){return graph('/sites/'+SITE+'/lists/'+LISTS[listKey]+'/items',{method:'POST',body:{fields}});}
async function patchItem(listKey,id,fields){return graph('/sites/'+SITE+'/lists/'+LISTS[listKey]+'/items/'+id+'/fields',{method:'PATCH',body:fields});}
async function loadParams(){try{const rs=await items(LISTS.params,'$expand=fields&$top=200');rs.map(F).filter(p=>norm(p.APP?.Value||p.APP)==='portaria'&&p.ATIVO!==false).forEach(p=>{PARAMS[p.CHAVE]=p.VALOR??'1';});}catch(e){console.warn('Parâmetros indisponíveis',e.message);}}
const paramOn=k=>!(k in PARAMS)||!['0','false','nao','não'].includes(norm(PARAMS[k]));
async function loadColabs(){if(COLABS)return COLABS;const rs=await items(LISTS.colab,'$expand=fields($select=NOME,MATRICULA,SITUACAO,DEPARTAMENTO)&$select=id,fields&$top=999');COLABS=rs.map(F).filter(c=>c.NOME);return COLABS;}
async function loadSiteUsers(){if(SITEUSERS)return SITEUSERS;SITEUSERS=[];if(!LISTS._users)return SITEUSERS;
 try{const rs=await items(LISTS._users,'$expand=fields($select=Title,EMail)&$select=id,fields&$top=999');
  SITEUSERS=rs.map(F).filter(u=>u.EMail&&u.Title&&!/\.onmicrosoft|app@|system/i.test(u.EMail));}catch(e){console.warn('Usuários do site indisponíveis',e.message);}
 return SITEUSERS;}
/* ---------- dados das visões ---------- */
async function refreshData(){
 const hoje=todayISO(),ontem=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
 const [mp,ag,pv,mv,mc,oc]=await Promise.all([
  items(LISTS.movP,'$expand=fields&$top=400&$orderby=fields/ENTRADA desc&$filter=fields/ENTRADA ge \''+ontem+'\''),
  items(LISTS.agend,'$expand=fields&$top=200&$filter=fields/DATA ge \''+hoje+'T00:00:00Z\' and fields/DATA le \''+hoje+'T23:59:59Z\''),
  items(LISTS.prevV,'$expand=fields&$top=200&$filter=fields/DATA ge \''+hoje+'T00:00:00Z\' and fields/DATA le \''+hoje+'T23:59:59Z\''),
  items(LISTS.movV,'$expand=fields&$top=300&$orderby=fields/ENTRADA desc&$filter=fields/ENTRADA ge \''+ontem+'\''),
  items(LISTS.merc,'$expand=fields&$top=300&$filter=fields/STATUS eq \'Aguardando retirada\''),
  items(LISTS.ocor,'$expand=fields&$top=100&$orderby=fields/Created desc')
 ]);
 D.dentro=mp.map(F).filter(x=>!x.SAIDA);
 D.movP=mp.map(F);
 D.agenda=ag.map(F);
 D.prev=pv.map(F);
 D.patio=mv.map(F).filter(x=>!x.SAIDA);
 D.movV=mv.map(F);
 D.merc=mc.map(F);
 D.ocor=oc.map(F).filter(x=>x.STATUS!=='Encerrada').slice(0,40);
}
/* ---------- porteiro de plantão ---------- */
const PKEY='polystell.portaria.porteiro';
function porteiro(){try{return localStorage.getItem(PKEY)||'';}catch{return'';}}
function setPorteiro(cb){dlg(`<h3>Quem está no posto?</h3><p>O nome fica registrado em cada movimento deste turno.</p>
 <div class="field"><label>Nome do porteiro</label><input id="dpnome" value="${esc(porteiro())}" maxlength="60" placeholder="Ex.: José da Silva"></div>
 <div class="acts"><button class="btn" onclick="dclose()">Cancelar</button><button class="btn primary" id="dpok">Confirmar</button></div>`);
 $('#dpok').onclick=()=>{const v=$('#dpnome').value.trim();if(!v){toast('Informe o nome do porteiro.',1);return;}try{localStorage.setItem(PKEY,v);}catch{}$('#pnome').textContent=v;dclose();cb&&cb();};
 $('#dpnome').focus();}
function precisaPorteiro(){if(porteiro())return false;setPorteiro();return true;}
/* ---------- navegação ---------- */
const NAV=[['inicio','Início','🏠'],['pessoas','Pessoas','🧍'],['veiculos','Veículos','🚚'],['mercadorias','Mercadorias','📦'],['ocorrencias','Ocorrências','⚠️']];
function renderNav(){$('#nav').innerHTML=NAV.map(([k,l,i])=>{const c=k==='pessoas'?D.dentro.length:k==='veiculos'?D.patio.length:k==='mercadorias'?D.merc.length:k==='ocorrencias'?D.ocor.length:null;
 return `<button data-v="${k}" class="${view===k?'on':''}"><span>${i}</span>${l}${c?`<span class="cnt">${c}</span>`:''}</button>`;}).join('');}
function go(v){view=v;render();}
function render(){renderNav();$('#vtitle').textContent=NAV.find(n=>n[0]===view)[1];VIEWS[view]();}
const VIEWS={};
/* ---------- componentes ---------- */
function pickerColab(inputSel,boxSel,onPick){const inp=$(inputSel),box=$(boxSel);
 const show=async()=>{const q=norm(inp.value);if(q.length<2){box.innerHTML='';box.hidden=true;return;}
  const cs=(await loadColabs()).filter(c=>norm(c.NOME).includes(q)||String(c.MATRICULA||'').includes(q)).slice(0,8);
  box.hidden=false;box.innerHTML=cs.length?cs.map(c=>`<button data-id="${c.id}"><b>${esc(c.NOME)}</b><div class="meta">${esc(c.MATRICULA||'sem matrícula')} · ${esc(c.DEPARTAMENTO?.Value||c.DEPARTAMENTO||'')} ${norm(c.SITUACAO||'').includes('deslig')?' · <span style=color:#b23c2e>DESLIGADO</span>':''}</div></button>`).join(''):'<button disabled>Nenhum colaborador encontrado</button>';};
 inp.addEventListener('input',show);
 box.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const c=COLABS.find(x=>x.id===b.dataset.id);box.hidden=true;onPick(c);};}
function pickerUser(inputSel,boxSel,onPick){const inp=$(inputSel),box=$(boxSel);
 const show=async()=>{const q=norm(inp.value);if(q.length<2){box.hidden=true;return;}
  const us=(await loadSiteUsers()).filter(u=>norm(u.Title).includes(q)).slice(0,8);
  box.hidden=false;box.innerHTML=us.length?us.map(u=>`<button data-id="${u.id}"><b>${esc(u.Title)}</b><div class="meta">${esc(u.EMail)}</div></button>`).join(''):'<button disabled>Ninguém encontrado — digite o nome como aparece no 365</button>';};
 inp.addEventListener('input',show);
 box.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const u=SITEUSERS.find(x=>x.id===b.dataset.id);box.hidden=true;onPick(u);};}

/* ---------- OCORRÊNCIAS ---------- */
VIEWS.ocorrencias=function(){
 $('#view').innerHTML=`
 <div class="cols">
 <div class="panel"><h2>➕ Registrar ocorrência</h2>
  <div class="grid2">
   <div class="field"><label>Tipo</label><select id="otipo">${['Segurança','Acesso indevido','Veículo','Mercadoria','Estrutura','Outro'].map(t=>`<option>${t}</option>`).join('')}</select></div>
   <div class="field"><label>Gravidade</label><select id="ograv"><option>Baixa</option><option>Média</option><option>Alta</option></select></div>
  </div>
  <div class="field"><label>Descrição *</label><textarea id="odesc" maxlength="2000" placeholder="O que aconteceu, quem estava envolvido, horário..."></textarea></div>
  <button class="btn primary" id="oreg" style="width:100%">Registrar ocorrência</button>
  <div class="note">Fotos podem ser anexadas depois, abrindo o item na lista. Ocorrências de gravidade <b>Alta</b> devem ser comunicadas imediatamente à Segurança.</div>
 </div>
 <div class="panel"><h2>⚠️ Em aberto <span class="chip blue">${D.ocor.length}</span></h2><div class="list">
  ${D.ocor.length?D.ocor.map(o=>`<div class="item"><div><div class="t">${esc(o.TIPO?.Value||o.TIPO||'')} <span class="chip ${({'Alta':'err','Média':'warn'})[o.GRAVIDADE?.Value||o.GRAVIDADE]||''}">${esc(o.GRAVIDADE?.Value||o.GRAVIDADE||'')}</span> <span class="chip">${esc(o.STATUS?.Value||o.STATUS||'Aberta')}</span></div>
   <div class="meta">${esc(String(o.DESCRICAO||'').slice(0,110))}${String(o.DESCRICAO||'').length>110?'…':''}</div>
   <div class="meta">por ${esc(o.REGISTRADO_POR||'—')} · ${dsh(o.Created)} ${hhmm(o.Created)}</div></div></div>`).join(''):'<div class="empty">Nenhuma ocorrência em aberto.</div>'}
 </div></div>
 </div>`;
 $('#oreg').onclick=async()=>{if(precisaPorteiro())return;
  const desc=$('#odesc').value.trim();if(!desc){toast('Descreva a ocorrência.',1);return;}
  $('#oreg').disabled=true;
  try{await addItem('ocor',{TIPO:$('#otipo').value,GRAVIDADE:$('#ograv').value,DESCRICAO:desc,STATUS:'Aberta',REGISTRADO_POR:porteiro()});
   toast('Ocorrência registrada.');await refreshData();render();}
  catch(e){toast('Erro: '+e.message,1);$('#oreg').disabled=false;}};
};
/* ---------- init ---------- */
function clock(){const n=new Date();$('#chora').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#cdata').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');const t=setTimeout(()=>{s.remove();no(new Error('Tempo esgotado ao carregar a biblioteca Microsoft.'));},15000);s.src=src;s.onload=()=>{clearTimeout(t);ok();};s.onerror=()=>{clearTimeout(t);no(new Error('Não foi possível carregar a biblioteca Microsoft.'));};document.head.appendChild(s);});}
async function start(){
 $('#gspin').hidden=false;$('#gbtn').hidden=true;$('#gmsg').textContent='Abrindo o posto da portaria...';
 try{await boot();await refreshData();}
 catch(e){$('#gspin').hidden=true;$('#gbtn').hidden=false;$('#gbtn').textContent='Tentar novamente';$('#gmsg').textContent='Não foi possível carregar: '+e.message;return;}
 $('#gate').hidden=true;$('#app').hidden=false;
 $('#pnome').textContent=porteiro()||'definir porteiro';
 $('#uinfo').textContent=account?.username||'Conta corporativa';
 if(!porteiro())setPorteiro();
 render();
 setInterval(async()=>{try{await refreshData();render();}catch{}},120000);
}
async function init(){
 clock();setInterval(clock,20000);
 $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v);});
 document.addEventListener('click',e=>{if(e.target.id==='ptrocar')setPorteiro();});
 if(location.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(location.hostname)){$('#gmsg').textContent='Acesse pelo endereço oficial (HTTPS): app.polystell.com.br/portaria/';$('#gbtn').hidden=true;return;}
 try{
  await loadScript(CONFIG.msalUrl);
  msalApp=new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:'https://login.microsoftonline.com/'+CONFIG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'sessionStorage'}});
  if(msalApp.initialize)await msalApp.initialize();
  const red=await msalApp.handleRedirectPromise();
  account=red?.account||msalApp.getActiveAccount()||msalApp.getAllAccounts()[0]||null;
  if(account){msalApp.setActiveAccount(account);await start();}
  else $('#gbtn').onclick=()=>msalApp.loginRedirect({scopes:CONFIG.scopes});
 }catch(e){$('#gmsg').textContent='Falha ao iniciar: '+(e?.message||'erro');$('#gbtn').textContent='Tentar novamente';$('#gbtn').onclick=()=>location.reload();}
}
init();
</script>
</body>
