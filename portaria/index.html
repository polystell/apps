<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portaria · Controle de Acesso | Polystell Apps</title>
<link rel="stylesheet" href="/core/polystell.css?v=2.5">
<style>
.esg button{min-width:118px;justify-content:center}
.pfoot{display:flex;gap:10px;align-items:center;margin-top:6px}
.pfoot .btn{flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:4px 0 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.setrow{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--line-2)}
.setrow:first-child{border-top:0}
.setrow .main{flex:1;min-width:0}
.setrow .main b{display:block;font-size:14px}
.setrow .main span{display:block;font-size:12px;color:var(--muted)}
.setrow input[type=number]{width:96px}
.lchk{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-right:10px;font-weight:500}
.ldia{font-weight:700;font-size:12.5px;color:var(--ink,#16233b);margin:16px 0 2px;text-transform:capitalize}
.ldia:first-child{margin-top:2px}
.lbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lrot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.lrot label{margin:0}
.lrot .btn.sm{min-height:32px;padding:5px 10px}
.lrot2{display:flex;gap:8px}
.lrot2 input{flex:1;min-width:0}
.lrot2 .btn{flex:none}
@media(max-width:560px){.lrot2{flex-direction:column}}
@media(max-width:600px){.setrow{flex-wrap:wrap}.setrow .main{flex-basis:100%}.setrow .chip{white-space:normal;max-width:100%}.setrow input[type=text],.setrow input[type=number]{width:100%!important}}
.rtab{width:100%;border-collapse:collapse;font-size:13.5px}
.rtab th,.rtab td{text-align:left;padding:7px 8px;border-top:1px solid var(--line-2,#eef1f6)}
.rtab th{color:var(--muted);font-weight:600;border-top:0}
.rtab td:nth-child(n+2),.rtab th:nth-child(n+2){text-align:right}
.rprintonly{display:none}
@media print{.ps-side,.ps-top,.ps-backdrop,.toolbar,.seg,#banners,.ps-pagehead p,.ps-sess,#ps-toast{display:none!important}.ps-main{margin:0!important}.ps-page{padding:0!important}.panel{border:0;padding:0}.rprintonly{display:block;margin-bottom:8px}}
pre.resumo{white-space:pre-wrap;font:inherit;font-size:13px;background:#f4f6fa;border-radius:9px;padding:10px 12px;margin:0 0 12px;color:#44526a}
</style>
</head>
<body>
<noscript><div class="ps-screen"><p>Ative o JavaScript para usar a Portaria.</p></div></noscript>
<script src="/core/polystell.js?v=2.5"></script>
<script src="comum.js?v=2.5"></script>
<script>
'use strict';
/* Portaria · Controle de Acesso — PC da guarita + Logística (v2.4).
   Correções do parecer: formulário preservado (atualização automática não
   recria formulários), checagem de entrada aberta no servidor, presença
   por STATUS_MOV, gravação parcial reconciliada, regras de convite,
   exceção de coleta com ocorrência, turno formal, Segurança (TI). */
const {$,$$,esc,norm,val,fmt,icon,toast,dialog,dateKey,todayKey}=PS;
const P=PORTARIA;
const ST={view:'painel',isTI:false,isExp:false,isRH:false,posto:true,log:false,rh:false,r:null,turno:null,busy:false,
 d:{openP:[],openV:[],movVHoje:[],movPHoje:[],agenda:[],agendaRec:[],prev:[],prevR:[],merc:[],ocor:[],trunc:false},
 sync:{at:null,err:null},
 f:{p:{tipo:'Colaborador',colab:null,modal:null,nome:'',empresa:'',doc:'',cracha:'',motivo:'',anf:null,q:'',ft:'Todos',pext:null,salvarCad:true},
    v:{prev:'',placa:'',mot:'',emp:'',fin:'Coleta',nf:'',auto:{}},
    m:{dest:null,setor:'',vol:'1',rem:'',desc:'',modo:'pessoa',setorDest:''},
    o:{tipo:'Segurança',grav:'Baixa',desc:''},
    h:{k:'p',q:''},
    l:{id:null,etag:null,tipo:'Coleta',dia:todayKey(),hora:'',transp:'',rem:'',nf:'',ordem:'',area:'',placa:'',mot:''},
    lv:{canc:false},
    r:{q:'',ft:'Todos',de:todayKey(),ate:todayKey(),tipo:'Todos',bq:''}}};
const GRUPO_TI='grp-plataforma-admin',GRUPO_EXP='grp-portaria-expedicao',GRUPO_GUARITA='grp-portaria-guarita',GRUPO_RH='grp-portaria-rh';
/* a guarita é a conta da portaria (permissão direta) ou quem estiver no grupo da guarita */
const CONTAS_POSTO=['portaria@polystell.com.br'];
let SHELL=null,TRANSP={};
const TITLES={painel:'Painel do posto',pessoas:'Pessoas',veiculos:'Veículos',mercadorias:'Mercadorias',ocorrencias:'Ocorrências',turno:'Turno',historico:'Histórico do dia',logistica:'Coletas e entregas',autorizar:'Autorizar coletas',presenca:'Na planta agora',consultas:'Consultas e ESG',seguranca:'Segurança (TI)'};
/* menu por papel: guarita (portaria@ e TI), Logística (Expedição e TI), Segurança (TI).
   Esconder o menu é usabilidade; quem barra de verdade é a permissão de cada lista. */
const NAV=()=>[
 {id:'painel',label:'Painel do posto',icon:'home',section:'Operação',hidden:!ST.posto},
 {id:'pessoas',label:'Pessoas',icon:'users',section:'Operação',hidden:!ST.posto},
 {id:'veiculos',label:'Veículos',icon:'truck',section:'Operação',hidden:!ST.posto},
 {id:'mercadorias',label:'Mercadorias',icon:'box',section:'Operação',hidden:!ST.posto},
 {id:'ocorrencias',label:'Ocorrências',icon:'alert',section:'Operação',hidden:!ST.posto},
 {id:'historico',label:'Histórico do dia',icon:'clock',section:'Posto',hidden:!ST.posto},
 {id:'turno',label:'Turno',icon:'swap',section:'Posto',hidden:!ST.posto},
 {id:'logistica',label:'Coletas e entregas',icon:'calendar',section:'Logística',hidden:!ST.log},
 {id:'autorizar',label:'Autorizar coletas',icon:'check',section:'Logística',hidden:!ST.log},
 {id:'presenca',label:'Na planta agora',icon:'users',section:'RH',hidden:!ST.rh},
 {id:'consultas',label:'Consultas e ESG',icon:'search',section:'RH',hidden:!ST.rh},
 {id:'seguranca',label:'Segurança (TI)',icon:'gear',section:'Administração',hidden:!ST.isTI}];
const VIEW_LOG=['logistica','autorizar'];
const VIEW_RH=['presenca','consultas'];
const podeVer=v=>v==='seguranca'?ST.isTI:VIEW_LOG.includes(v)?ST.log:VIEW_RH.includes(v)?ST.rh:ST.posto;
const inicial=()=>ST.posto?'painel':ST.log?'logistica':'presenca';
const TIPOS_P=['Colaborador','Diretoria','Visitante','Prestador','Terceiro'];
const MODAIS=['Carro','Moto','Ônibus/Fretado','Bicicleta','A pé','Carona','Outro'];
const FILTROS={'Todos':null,'Colaboradores':['Colaborador','Diretoria'],'Visitantes':['Visitante'],'Prestadores':['Prestador'],'Terceiros':['Terceiro']};
const tAtivo=()=>P.turnoValido(ST.turno);
const porteiro=()=>tAtivo()?ST.turno.PARA:'';
const isToday=v=>!!v&&new Date(v).toDateString()===new Date().toDateString();
const quando=v=>isToday(v)?fmt.hm(v):fmt.dmhm(v);
const idade=v=>Date.now()-new Date(v).getTime();
function setPath(path,v){const [a,b]=path.split('.');ST.f[a][b]=v;}
/* ---------------- pendências ---------------- */
function pend(){const hP=P.param('ALERTA_PERMANENCIA'),hV=P.param('ALERTA_PATIO'),dM=P.param('ALERTA_MERCADORIA');
 return {p:ST.d.openP.filter(m=>idade(m.ENTRADA)>hP*36e5),v:ST.d.openV.filter(m=>idade(m.ENTRADA)>hV*36e5),m:ST.d.merc.filter(m=>idade(m.CHEGADA)>dM*864e5)};}
/* ---------------- dados ---------------- */
/* atualização coalescida: um pedido feito durante outra atualização roda
   de novo ao final (quem acabou de gravar sempre recebe dados novos) */
let running=null,again=false;
async function refresh(){if(running){again=true;return running;}
 running=(async()=>{do{again=false;await doRefresh();}while(again);})();
 try{await running;}finally{running=null;}}
async function doRefresh(){
 const prevR=()=>P.prevEntre(-1,P.JANELA_PREV);
 const plan=ST.posto?[['openP',P.abertosP],['openV',P.abertosV],['movVHoje',P.veicHoje],['movPHoje',P.pessoasHoje],['agenda',P.agendaHoje],['agendaRec',P.agendaRecente],['prev',P.prevHoje],['merc',P.mercAguardando],['ocor',P.ocorAbertas],['turno',P.turnoAtual],['params',P.loadParams]]
  :[...(ST.log?[['openV',P.abertosV],['movVHoje',P.veicHoje]]:[]),...(ST.rh?[['openP',P.abertosP]]:[]),['params',P.loadParams]];
 if(ST.log)plan.push(['prevR',prevR]);
 const pendAntes=ST.sync.at?new Set(ST.d.openV.filter(v=>val(v.FINALIDADE)==='Coleta'&&val(v.AUT_EXPEDICAO)!=='Autorizado').map(v=>v.id)):new Set();
 const rs=await Promise.allSettled(plan.map(([,f])=>f()));const fails=[];
 rs.forEach((r,i)=>{const k=plan[i][0];if(r.status!=='fulfilled'){fails.push(r.reason);return;}if(k==='turno'){ST.turno=r.value.turno;}else if(k!=='params')ST.d[k]=r.value;});
 ST.d.trunc=['openP','openV','movVHoje','movPHoje','agenda','agendaRec','prev','prevR','merc','ocor'].some(k=>ST.d[k]&&ST.d[k].truncated);
 /* guarita: avisa quando a Expedição libera uma coleta que estava aguardando */
 if(ST.posto)ST.d.openV.filter(v=>pendAntes.has(v.id)&&val(v.AUT_EXPEDICAO)==='Autorizado').forEach(v=>toast('Coleta '+v.PLACA+' autorizada — '+String(v.AUT_POR||'').slice(0,90)));
 ST.sync=fails.length?{at:ST.sync.at,err:(fails[0]?.message||'erro')+(fails.length>1?' (+'+(fails.length-1)+' consulta(s))':'')}:{at:new Date(),err:null};
 if(ST.posto&&!fails.length&&tAtivo()){try{const fixed=await P.reconciliar(ST.d.agendaRec||[],ST.d.openP);if(fixed)ST.d.agenda=await P.agendaHoje();}catch(e){console.warn(e);}}
 chrome();if(VIEWS[ST.view]?.update)VIEWS[ST.view].update();
 checaTroca();
}
function chrome(){if(!SHELL)return;const pd=pend();
 const aguard=ST.d.openV.filter(v=>val(v.FINALIDADE)==='Coleta'&&val(v.AUT_EXPEDICAO)!=='Autorizado').length;
 SHELL.setCounts({pessoas:{n:ST.d.openP.length,alert:pd.p.length>0},veiculos:{n:ST.d.openV.length,alert:pd.v.length>0},mercadorias:{n:ST.d.merc.length,alert:pd.m.length>0},ocorrencias:{n:ST.d.ocor.length},autorizar:{n:aguard,alert:aguard>0},presenca:{n:ST.d.openP.length}});
 if(ST.sync.err)SHELL.setSync('bad','Falha ao atualizar'+(ST.sync.at?' · dados de '+fmt.hm(ST.sync.at):''));
 else if(ST.sync.at)SHELL.setSync('ok','Atualizado às '+fmt.hm(ST.sync.at));
 if(!ST.posto){SHELL.setCtx('<div class="ps-ctx"><small>'+(ST.log?'Logística':'RH')+'</small><b>'+esc(PS.auth.account?.name||'')+'</b><span>'+(ST.log&&ST.rh?'Expedição · RH':ST.log?'Expedição':'Consulta')+'</span></div>');return;}
 SHELL.setCtx(tAtivo()?'<div class="ps-ctx"><small>Plantão</small><b>'+esc(ST.turno.PARA)+'</b><span>desde '+quando(ST.turno.CIENCIA_EM)+' · até '+fmt.hm(P.fimDoTurno(ST.turno))+'</span><button data-turno>Trocar turno</button></div>'
  :'<div class="ps-ctx"><small>Plantão</small><b>Nenhum turno aberto</b><button data-turno>Abrir turno</button></div>');}
function banners(){const el=$('#banners');if(!el)return;let h='';
 if(ST.sync.err)h+='<div class="banner err">'+icon('cloudoff')+'<span><b>Os dados podem estar desatualizados.</b> '+esc(ST.sync.err)+'</span><button class="btn sm" data-refresh>'+icon('refresh')+'Tentar agora</button></div>';
 const fimT=ST.posto&&P.trocaPendente(ST.turno);
 if(fimT)h+='<div class="banner warn">'+icon('swap')+'<span><b>Hora da troca de turno ('+fmt.hm(fimT)+').</b> Passe o turno para o porteiro que assume o posto.</span><button class="btn sm primary" data-turno>Passar o turno</button></div>';
 if(ST.posto&&!tAtivo())h+='<div class="banner warn">'+icon('swap')+'<span><b>Nenhum turno aberto.</b> Abra o turno para registrar movimentos com o nome do porteiro.</span><button class="btn sm primary" data-turno>Abrir turno</button></div>';
 if(ST.d.trunc)h+='<div class="banner warn">'+icon('alert')+'<span>Algumas listas passaram do limite de leitura e não foram carregadas por completo. Avise a TI.</span></div>';
 el.innerHTML=h;}
function needTurno(){if(tAtivo()||!ST.posto)return false;dlgTurno();return true;}
function writeErr(e){if(e.code==='session'){toast(e.message,'warn');return;}
 if(e.code==='turno'){toast(e.message,'warn');refresh().then(()=>{if(!tAtivo())dlgTurno();});return;}if(e.uncertain){toast('Sem confirmação do servidor. Confira a lista antes de repetir.','warn');refresh();}else toast(e.message||'Erro ao gravar.','err');}
/* ---------------- navegação ---------------- */
const VIEWS={};
function page(title,sub,body,acts=''){SHELL.page.innerHTML='<div class="ps-pagehead"><div><h1>'+esc(title)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'+acts+'</div><div id="banners"></div>'+body;banners();}
function go(v){if(!VIEWS[v]||!podeVer(v))v=inicial();ST.view=v;SHELL.setCurrent(v,TITLES[v]);SHELL.page.oninput=null;SHELL.page.onclick=null;SHELL.page.onchange=null;VIEWS[v].mount();VIEWS[v].update();SHELL.page.focus({preventScroll:true});window.scrollTo(0,0);}
function bindInputs(onLive){SHELL.page.oninput=e=>{const b=e.target.dataset.bind;if(!b)return;setPath(b,e.target.type==='checkbox'?e.target.checked:e.target.value);if(e.target.dataset.live&&onLive)onLive();};}
/* na hora da troca, abre a passagem de turno sozinho (uma vez por horário, sem atropelar outra janela aberta) */
function checaTroca(){if(!ST.posto||!SHELL)return;const fim=P.trocaPendente(ST.turno);if(!fim||ST.trocaAvisada===+fim)return;
 const d=$('#ps-dlg');if(d&&d.open)return;ST.trocaAvisada=+fim;banners();dlgTurno({auto:fim});}
document.addEventListener('click',e=>{if(e.target.closest('[data-turno]'))dlgTurno();if(e.target.closest('[data-refresh]'))refresh();
 const k=e.target.closest('[data-go]');if(k)go(k.dataset.go);});
/* ---------------- seletor do diretório (só o próprio bloco é redesenhado) ---------------- */
function picker(box,{value,placeholder,label,onPick,onClear}){
 if(value){box.innerHTML='<div class="selbox"><div class="main"><b>'+esc(value.nome)+'</b><div class="meta">'+esc([value.mat&&'Matr. '+value.mat,value.dep].filter(Boolean).join(' · '))+'</div></div><button type="button" data-x>trocar</button></div>';box.querySelector('[data-x]').onclick=onClear;return;}
 box.innerHTML='<div class="pick"><input type="search" autocomplete="off" placeholder="'+esc(placeholder)+'" aria-label="'+esc(label)+'"><div class="menu" hidden></div></div>';
 const inp=box.querySelector('input'),menu=box.querySelector('.menu');let res=[];
 const show=async()=>{let lista=[];try{lista=await P.dir();}catch(e){menu.hidden=false;menu.innerHTML='<button type="button" disabled>Diretório indisponível: '+esc(e.message)+'</button>';return;}
  res=P.buscaColab(lista,inp.value);if(inp.value.trim().length<2){menu.hidden=true;return;}
  menu.hidden=false;menu.innerHTML=res.length?res.map((c,i)=>'<button type="button" data-i="'+i+'"><b>'+esc(c.nome)+'</b><div class="meta">'+esc(c.mat?'Matr. '+c.mat:'sem matrícula')+(c.dep?' · '+esc(c.dep):'')+(P.desligado(c)?' · <span style="color:var(--err);font-weight:700">'+esc((c.sit||'situação não informada').toUpperCase())+'</span>':'')+'</div></button>').join(''):'<button type="button" disabled>Ninguém encontrado no diretório</button>';};
 inp.addEventListener('input',show);
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&res[0]){e.preventDefault();onPick(res[0]);}if(e.key==='Escape')menu.hidden=true;});
 inp.addEventListener('blur',()=>setTimeout(()=>{menu.hidden=true;},200));
 menu.onclick=e=>{const b=e.target.closest('[data-i]');if(b)onPick(res[+b.dataset.i]);};
}
const chipPrev=s=>s==='Concluído'?'ok':s==='Na portaria'?'warn':['Cancelado','Não veio'].includes(s)?'err':'blue';
/* ================= PAINEL ================= */
VIEWS.painel={
 mount(){page('Painel do posto','Visão do turno: quem está dentro, o que está previsto e o que precisa de atenção.',
  '<div class="kpis" id="kpis"></div><div class="cols"><div class="panel"><div class="panel-h">'+icon('calendar')+'<h2>Agenda de hoje</h2><span class="sp"><span class="count" id="agc"></span></span></div><div class="rows" id="agl"></div></div>'+
  '<div><div class="panel"><div class="panel-h">'+icon('truck')+'<h2>Coletas e entregas previstas</h2><span class="sp"><span class="count" id="pvc"></span></span></div><div class="rows" id="pvl"></div></div>'+
  '<div class="panel"><div class="panel-h">'+icon('alert')+'<h2>Pendências</h2><span class="sp"><span class="count" id="pdc"></span></span></div><div class="rows" id="pdl"></div></div></div></div>');
  SHELL.page.onclick=e=>{const c=e.target.closest('[data-chegada]');if(c)chegada(c.dataset.chegada);const s=e.target.closest('[data-saida]');if(s){const m=ST.d.openP.find(x=>x.id===s.dataset.saida);if(m)doSaidaPessoa(m);}};},
 update(){banners();if(!$('#kpis'))return;const pd=pend(),D=ST.d;
  const prevAg=D.agenda.filter(a=>['Agendado','Na portaria'].includes(val(a.STATUS))&&!P.abertoDoAgend(D.openP,a.id)).length;
  const npend=pd.p.length+pd.v.length+pd.m.length;
  $('#kpis').innerHTML=[['pessoas',D.openP.length,'pessoas na planta',pd.p.length],['veiculos',D.openV.length,'veículos no pátio',pd.v.length],['mercadorias',D.merc.length,'mercadorias aguardando',pd.m.length]].map(([g,n,l,a])=>'<button class="kpi'+(a?' alert':'')+'" data-go="'+g+'"><b>'+n+'</b><span>'+l+(a?' · '+a+' pendente(s)':'')+'</span></button>').join('')+
   '<div class="kpi"><b>'+prevAg+'</b><span>visitas ainda previstas hoje</span></div>';
  $('#pdc').textContent=npend+D.ocor.length;
  const ag=D.agenda.slice().sort((a,b)=>String(a.HORA||'').localeCompare(String(b.HORA||'')));
  $('#agc').textContent=ag.length;
  $('#agl').innerHTML=ag.length?ag.map(a=>{const ab=P.abertoDoAgend(D.openP,a.id);const r=P.regraConvite(a,ab);const st=ab?'Dentro':val(a.STATUS)||'Agendado';
   const cls=ab?'ok':st==='Saiu'?'':['Cancelado','Não veio'].includes(st)?'err':st==='Na portaria'?'warn':'blue';
   const act=r.acao==='entrada'?'<button class="btn sm primary" data-chegada="'+a.id+'">'+icon('in')+(r.reentrada?'Reentrada':'Chegou')+'</button>':r.acao==='saida'?'<button class="btn sm" data-saida="'+ab.id+'">'+icon('out')+'Saída</button>':'';
   return '<div class="row"><div class="main"><div class="t">'+esc(a.NOME)+'</div><div class="meta">'+esc([a.HORA,val(a.TIPO),a.EMPRESA,a.ANFITRIAO_NOME&&'recebe: '+a.ANFITRIAO_NOME].filter(Boolean).join(' · '))+'</div><div class="tags"><span class="chip dot '+cls+'">'+esc(st)+'</span></div></div><div class="act">'+act+'</div></div>';}).join(''):'<div class="empty">Nenhuma visita agendada para hoje.</div>';
  $('#pvc').textContent=D.prev.length;
  $('#pvl').innerHTML=D.prev.length?D.prev.map(p=>{const s=P.situacaoPrev(p,D.movVHoje);const quem=TRANSP[P.lid(p.TRANSPORTADORALookupId)]||p.REMETENTE||'—';
   return '<div class="row"><div class="main"><div class="t">'+esc(val(p.TIPO))+' · '+esc(quem)+'</div><div class="meta">'+esc([p.HORA||'sem horário',p.NF&&'NF '+p.NF,p.AREA].filter(Boolean).join(' · '))+'</div></div><div class="act"><span class="chip dot '+chipPrev(s)+'">'+esc(s)+'</span></div></div>';}).join(''):'<div class="empty">Nada previsto para hoje.</div>';
  const pl=[...pd.p.map(m=>['pessoas','Entrada aberta há '+fmt.dur(idade(m.ENTRADA)),m.NOME]),...pd.v.map(m=>['veiculos','No pátio há '+fmt.dur(idade(m.ENTRADA)),m.PLACA]),...pd.m.map(m=>['mercadorias','Aguardando há '+fmt.dur(idade(m.CHEGADA)),m.DESTINATARIO_NOME||m.DESCRICAO])];
  if(D.ocor.length)pl.push(['ocorrencias',D.ocor.length+' ocorrência(s) em aberto','Ocorrências']);
  $('#pdl').innerHTML=pl.length?pl.map(([g,t,n])=>'<div class="row flag"><div class="main"><div class="t">'+esc(n||'—')+'</div><div class="meta">'+esc(t)+'</div></div><div class="act"><button class="btn sm" data-go="'+g+'">Ver</button></div></div>').join(''):'<div class="empty">Nenhuma pendência no momento.</div>';}
};
async function chegada(id){if(needTurno())return;const a=ST.d.agenda.find(x=>x.id===id);if(!a)return;
 const r=P.regraConvite(a,P.abertoDoAgend(ST.d.openP,a.id));
 if(r.acao==='bloq'){dialog({title:'Entrada não liberada',html:'<div class="banner err">'+icon('lock')+'<span>'+esc(r.motivo)+'</span></div>'});return;}
 await dialog({title:r.reentrada?'Reentrada de visitante':'Confirmar chegada',

 dialog({title:'Cancelar previsão',html:'<p><b>'+esc(val(p.TIPO))+' · '+esc(quemPrev(p))+'</b><br>'+esc([ROTULO_DIA(dateKey(p.DATA)),p.HORA,p.NF&&'NF '+p.NF].filter(Boolean).join(' · '))+'</p><div class="note">A previsão continua na lista como <b>Cancelado</b>, e a portaria deixa de oferecê-la ao registrar a entrada.</div>',
  actions:[{label:'Voltar',value:null},{label:'Cancelar previsão',kind:'danger solid',onClick:async()=>{
   try{const r=await P.cancelarPrev(id,p._etag);if(r.conflito){toast('Esta previsão foi alterada por outra pessoa. Confira e tente de novo.','warn');refresh();return true;}

VIEWS.autorizar={
 mount(){page('Autorizar coletas','Coletas no pátio aguardando a liberação da Expedição. A autorização fica registrada em seu nome e aparece na portaria em até 1 minuto.',

  '<div class="panel"><div class="panel-h">'+icon('check')+'<h2>Liberadas hoje</h2><span class="sp"><span class="count" id="adcount"></span></span></div><div class="rows" id="adlist"></div></div></div>');
  SHELL.page.onclick=e=>{const a=e.target.closest('[data-xaut]');if(a)autorizarExpedicao(a.dataset.xaut);};},
 update(){banners();if(!$('#alist'))return;
  const prevTxt=v=>{const p=ST.d.prevR.find(x=>x.id===P.lid(v.PREVISAOLookupId));return p?'Previsão: '+quemPrev(p)+(p.NF?' · NF '+p.NF:'')+(p.ORDEM?' · ordem '+p.ORDEM:'')+(p.HORA?' · '+p.HORA:''):'Sem previsão vinculada pela portaria';};

  $('#acount').textContent=ag.length;

   :'<div class="empty">Nenhuma coleta aguardando autorização.</div>';
  const lib=ST.d.movVHoje.filter(v=>val(v.FINALIDADE)==='Coleta'&&['Autorizado','Exceção'].includes(val(v.AUT_EXPEDICAO))).sort((a,b)=>new Date(b.ENTRADA)-new Date(a.ENTRADA));
  $('#adcount').textContent=lib.length;
  $('#adlist').innerHTML=lib.length?lib.map(v=>{const ex=val(v.AUT_EXPEDICAO)==='Exceção',ab=val(v.STATUS_MOV)==='Aberto';
   return '<div class="row"><div class="main"><div class="t">'+esc(v.PLACA)+(v.EMPRESA?' · '+esc(v.EMPRESA):'')+'</div><div class="meta">'+esc([v.NF&&'NF '+v.NF,ab?'ainda no pátio':'saiu '+quando(v.SAIDA)].filter(Boolean).join(' · '))+'</div>'+(v.AUT_POR?'<div class="detail">'+esc(v.AUT_POR)+'</div>':'')+'<div class="tags"><span class="chip dot '+(ex?'err':'ok')+'">'+(ex?'Saiu por exceção':'Autorizada')+'</span></div></div></div>';}).join('')
   :'<div class="empty">Nenhuma coleta liberada hoje.</div>';}
};
function autorizarExpedicao(id){const v=ST.d.openV.find(x=>x.id===id);if(!v)return;const nome=PS.auth.account?.name||PS.auth.account?.username||'Expedição';
 dialog({title:'Autorizar saída da coleta',html:'<dl class="kv"><dt>Placa</dt><dd>'+esc(v.PLACA)+'</dd><dt>Motorista</dt><dd>'+esc(v.MOTORISTA||'—')+'</dd><dt>Empresa</dt><dd>'+esc(v.EMPRESA||'—')+'</dd><dt>Nota fiscal</dt><dd>'+esc(v.NF||'—')+'</dd></dl>'+
  '<div class="field"><label for="dxo">Observação (opcional)</label><input id="dxo" maxlength="120" placeholder="Ex.: NF e lacre conferidos"></div>'+
  '<div class="note">Fica registrado: autorizado por <b>'+esc(nome)+'</b> (Expedição), com data e hora.</div>',
  actions:[{label:'Cancelar',value:null},{label:'Autorizar saída',kind:'primary',onClick:async d=>{
   try{const r=await P.autorizarPelaExpedicao(id,nome,d.querySelector('#dxo').value.trim());
    if(r.jaSaiu)toast('Este veículo já saiu do pátio — nada foi gravado.','warn');
    else if(r.jaAut)toast('Esta coleta já estava autorizada'+(r.mov&&r.mov.AUT_POR?': '+String(r.mov.AUT_POR).slice(0,80):'.'),'warn');
    else toast('Saída autorizada: '+v.PLACA+'. A portaria vê em até 1 minuto.');
    refresh();return true;}catch(e){writeErr(e);return false;}}}]});}
/* ================= RH · CONSULTA (somente leitura) ================= */
const TIPO_GRUPO={'Todos':null,'Colaboradores':['Colaborador','Diretoria'],'Visitantes':['Visitante'],'Prestadores':['Prestador'],'Terceiros':['Terceiro']};
VIEWS.presenca={
 mount(){page('Na planta agora','Quem está dentro neste momento, conforme os registros da portaria. Somente consulta.',
  '<div class="panel"><div class="toolbar"><input type="search" data-bind="r.q" data-live="1" value="'+esc(ST.f.r.q)+'" placeholder="Buscar nome, matrícula, empresa, anfitrião…" aria-label="Buscar na planta"><button class="btn" type="button" id="rprint">Imprimir lista</button></div>'+
  '<div class="seg" id="rft" style="margin-bottom:8px"></div><div class="rows" id="rlist"></div></div>');
  bindInputs(()=>this.update());
  SHELL.page.onclick=e=>{const f=e.target.closest('[data-rft]');if(f){ST.f.r.ft=f.dataset.rft;this.update();return;}if(e.target.closest('#rprint'))window.print();};},
 update(){banners();if(!$('#rlist'))return;const F=ST.f.r;const all=ST.d.openP;
  const cnt=k=>TIPO_GRUPO[k]?all.filter(m=>TIPO_GRUPO[k].includes(val(m.TIPO))).length:all.length;
  $('#rft').innerHTML=Object.keys(TIPO_GRUPO).map(k=>'<button type="button" data-rft="'+k+'" aria-pressed="'+(F.ft===k)+'">'+k+' <span class="count">'+cnt(k)+'</span></button>').join('');
  let rows=all.slice().sort((a,b)=>String(a.NOME).localeCompare(String(b.NOME),'pt-BR'));
  if(TIPO_GRUPO[F.ft])rows=rows.filter(m=>TIPO_GRUPO[F.ft].includes(val(m.TIPO)));
  const q=norm(F.q);if(q)rows=rows.filter(m=>norm([m.NOME,m.MATRICULA,m.EMPRESA,m.ANFITRIAO_NOME,m.CRACHA].join(' ')).includes(q));
  $('#rlist').innerHTML='<div class="detail rprintonly">Portaria Polystell · na planta em '+esc(fmt.dmhm(new Date()))+' · '+rows.length+' pessoa(s)</div>'+(rows.length?rows.map(m=>'<div class="row"><div class="main"><div class="t">'+esc(m.NOME)+'</div><div class="meta">'+esc([val(m.TIPO),m.MATRICULA&&'Matr. '+m.MATRICULA,m.EMPRESA,m.ANFITRIAO_NOME&&'recebe: '+m.ANFITRIAO_NOME,m.CRACHA&&'crachá '+m.CRACHA].filter(Boolean).join(' · '))+'</div><div class="detail">Entrou '+quando(m.ENTRADA)+' ('+fmt.dur(idade(m.ENTRADA))+')'+(m.PORTEIRO_ENT?' · '+esc(m.PORTEIRO_ENT):'')+'</div></div></div>').join(''):'<div class="empty">'+(all.length?'Ninguém para o filtro.':'Ninguém registrado dentro agora.')+'</div>');}
};
VIEWS.consultas={
 mount(){const F=ST.f.r;
  page('Consultas e ESG','Movimentos de pessoas por período (pela data de entrada), com exportação para Excel e resumo do meio de transporte dos colaboradores.',
  '<div class="panel"><div class="grid3"><div class="field"><label for="rde">De *</label><input id="rde" type="date" data-bind="r.de" max="'+todayKey()+'" value="'+esc(F.de)+'"></div><div class="field"><label for="rate">Até *</label><input id="rate" type="date" data-bind="r.ate" max="'+todayKey()+'" value="'+esc(F.ate)+'"></div>'+
  '<div class="field"><label for="rtp">Tipo</label><select id="rtp" data-bind="r.tipo">'+Object.keys(TIPO_GRUPO).map(k=>'<option'+(F.tipo===k?' selected':'')+'>'+k+'</option>').join('')+'</select></div></div>'+
  '<div class="field"><label for="rbq">Buscar</label><input id="rbq" type="search" data-bind="r.bq" value="'+esc(F.bq)+'" placeholder="Nome, matrícula, empresa, anfitrião…"></div>'+
  '<div class="lbtns"><button class="btn primary" type="button" id="rgo">'+icon('search')+'Consultar</button><button class="btn" type="button" id="rcsv" disabled>Exportar para Excel (CSV)</button></div><div class="detail" style="margin-top:8px">Período de até '+P.CONSULTA_MAX_DIAS+' dias por consulta. Os dados ficam só na sua tela e no arquivo exportado.</div></div>'+
  '<div id="rres"></div>');
  bindInputs();
  SHELL.page.onclick=e=>{if(e.target.closest('#rgo'))consultarRH();if(e.target.closest('#rcsv'))exportarRH();};
  if(ST.r)desenhaRH();},
 update(){banners();}
};
function filtraRH(rows){const F=ST.f.r;let r=rows;if(TIPO_GRUPO[F.tipo])r=r.filter(m=>TIPO_GRUPO[F.tipo].includes(val(m.TIPO)));
 const q=norm(F.bq);if(q)r=r.filter(m=>norm([m.NOME,m.MATRICULA,m.EMPRESA,m.ANFITRIAO_NOME].join(' ')).includes(q));return r.sort((a,b)=>new Date(b.ENTRADA)-new Date(a.ENTRADA));}
async function consultarRH(){const F=ST.f.r;const b=$('#rgo');
 const erro=P.validarPeriodo(F.de,F.ate);if(erro){toast(erro,'err');return;}
 b.disabled=true;$('#rres').innerHTML='<div class="panel"><div class="empty">Consultando…</div></div>';
 try{const rows=await P.movimentosPeriodo(F.de,F.ate);ST.r={de:F.de,ate:F.ate,rows:filtraRH(rows),truncated:!!rows.truncated};desenhaRH();}
 catch(e){$('#rres').innerHTML='';toast(e.message||'Erro na consulta.','err');}finally{const x=$('#rgo');if(x)x.disabled=false;}}
function desenhaRH(){const el=$('#rres');if(!el||!ST.r)return;const R=ST.r,rows=R.rows;const MAXL=300;
 const pessoas=new Set(rows.map(m=>m.MATRICULA?'M:'+m.MATRICULA:'N:'+norm(m.NOME))).size;
 const esg=P.resumoESG(rows);
 const cb=$('#rcsv');if(cb)cb.disabled=!rows.length;
 el.innerHTML=(R.truncated?'<div class="banner warn">'+icon('alert')+'<span>O período tem mais registros do que o limite de leitura. Reduza o período — o resultado abaixo está incompleto.</span></div>':'')+
  '<div class="cols"><div class="panel"><div class="panel-h">'+icon('users')+'<h2>Movimentos</h2><span class="sp"><span class="count">'+rows.length+'</span></span></div><div class="detail" style="margin-bottom:6px">'+esc(fmt.data(R.de)+' a '+fmt.data(R.ate))+' · '+rows.length+' movimento(s) · '+pessoas+' pessoa(s)</div>'+
  '<div class="rows">'+(rows.length?rows.slice(0,MAXL).map(m=>{const perm=m.SAIDA?fmt.dur(new Date(m.SAIDA)-new Date(m.ENTRADA)):'';
   return '<div class="row"><div class="main"><div class="t">'+esc(m.NOME)+'</div><div class="meta">'+esc([val(m.TIPO),m.MATRICULA&&'Matr. '+m.MATRICULA,m.EMPRESA,m.ANFITRIAO_NOME&&'recebe: '+m.ANFITRIAO_NOME,val(m.MODAL)&&'veio de '+val(m.MODAL)].filter(Boolean).join(' · '))+'</div>'+
    '<div class="detail">Entrada '+esc(fmt.dmhm(m.ENTRADA))+(m.PORTEIRO_ENT?' ('+esc(m.PORTEIRO_ENT)+')':'')+(m.SAIDA?' · Saída '+esc(fmt.dmhm(m.SAIDA))+(m.PORTEIRO_SAI?' ('+esc(m.PORTEIRO_SAI)+')':'')+' · '+esc(perm):' · ainda dentro')+(m.SEM_CRACHA===true?' · sem crachá':'')+'</div></div></div>';}).join('')+(rows.length>MAXL?'<div class="empty">Mostrando '+MAXL+' de '+rows.length+'. Exporte para ver todos.</div>':''):'<div class="empty">Nenhum movimento no período para o filtro.</div>')+'</div></div>'+
  '<div class="panel"><div class="panel-h">'+icon('leaf')+'<h2>ESG — como os colaboradores vieram</h2></div>'+
  (esg.total?'<div class="detail" style="margin-bottom:8px">'+esg.total+' colaborador-dia(s) no período (cada pessoa conta uma vez por dia).</div><table class="rtab"><thead><tr><th>Meio de transporte</th><th>Colaborador-dia</th><th>%</th></tr></thead><tbody>'+
    esg.linhas.map(l=>'<tr><td>'+esc(l.modal)+'</td><td>'+l.n+'</td><td>'+l.pct.toFixed(1).replace('.',',')+'%</td></tr>').join('')+'</tbody></table>'
   :'<div class="empty">Sem entradas de colaboradores no período.</div>')+'</div></div>';}
function exportarRH(){if(!ST.r||!ST.r.rows.length)return;const csv=P.csvMovimentos(ST.r.rows);
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='portaria-movimentos_'+ST.r.de+'_a_'+ST.r.ate+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Arquivo gerado: '+ST.r.rows.length+' movimento(s).');}
/* ================= início ================= */
(async function init(){
 PS.screens.loading('Abrindo o posto da portaria…');
 let acc;
 try{acc=await PS.auth.init();}
 catch(e){PS.screens.error(e.code==='https'?'Endereço não seguro':'Não foi possível iniciar',e.message);return;}
 if(!acc){PS.screens.login({app:'Portaria · Controle de Acesso',text:'Entre com a conta da portaria ou com a sua conta corporativa.',onLogin:()=>PS.auth.login()});return;}
 try{
  const g=await PS.groups();
  ST.isTI=!!g&&g.has(GRUPO_TI);ST.isExp=!!g&&g.has(GRUPO_EXP);
  ST.isGuarita=(!!g&&g.has(GRUPO_GUARITA))||CONTAS_POSTO.includes(String(acc.username||'').toLowerCase());
  ST.isRH=!!g&&g.has(GRUPO_RH);
  ST.posto=ST.isTI||ST.isGuarita;ST.log=ST.isTI||ST.isExp;ST.rh=ST.isTI||ST.isRH;
  if(!ST.posto&&!ST.log&&!ST.rh){PS.screens.error('Sem perfil na Portaria','Sua conta não tem perfil de guarita, Expedição, RH ou TI neste aplicativo.',{retry:g===null,
    details:[...(g===null?['Não foi possível ler seus grupos no Microsoft 365 — tente novamente ou fale com a TI.']:[]),'Para agendar uma visita, use "Minhas visitas".','Se você precisa de acesso, peça à TI.'],
    action:{label:'Agendar uma visita',onClick:()=>{location.href='agendar.html';}}});return;}
  const b=await P.boot({posto:ST.posto,log:ST.log,rh:ST.rh});
  if(!b.ok){const det=b.faltando.slice();if(g===null)det.push('Não foi possível ler seus grupos no Microsoft 365 (a Expedição e a TI dependem disso). Peça à TI para conferir a permissão GroupMember.Read.All do app.');
   PS.screens.error('Estrutura incompleta no SharePoint','A Portaria precisa destes itens antes de operar. Ajuste e tente novamente:',{details:det});return;}
  PS.auth.ready();window.addEventListener('ps:session',()=>refresh());
  TRANSP=await P.transp();
  SHELL=PS.mount({app:'Portaria',nav:NAV(),current:inicial(),onNav:go,account:acc});
  go(inicial());
  await refresh();
  if(ST.posto&&!tAtivo())dlgTurno();
  setInterval(()=>{if(!document.hidden)refresh();},60000);
  setInterval(()=>{const t=ST.turnoMarca,ok=tAtivo(),f=!!P.trocaPendente(ST.turno);if(t!==ok+'|'+f){ST.turnoMarca=ok+'|'+f;chrome();banners();}checaTroca();},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
 }catch(e){console.error(e);PS.screens.error('Não foi possível abrir o posto',e.message);}
})();
</script>
